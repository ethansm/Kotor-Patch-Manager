; Character Active Effects Panel (Mod 14) -- copy to the game folder as chareffects.ini; hot-reloaded once a second.
; stage 0 = frame + header + summary text, log-only effect dump; 1 = full list with sections and scrolling
enabled=1
stage=1
poll_ms=250
show_permanent=1
wheel_scroll=1
; hover tooltip on a row after tooltip_delay_ms: name + time, every stat line, the spell description (tooltip_desc=0 hides it)
tooltips=1
tooltip_delay_ms=350
tooltip_desc=1
; tooltip line pitch fine-tune (10x10 font; raise if lines overlap the bottom edge, lower if there is a gap)
tip_line_scale=1.0
; stat column between name and time (what the effect does, from the live effect values); width cap in GUI units
stat_column=1
; stat column: widest stat of the visible rows, at least stat_min_frac of the room when names compete; stat_max_w caps it (0 = no cap)
stat_max_w=0
stat_min_frac=0.4
; 10x10 text width factor (calibrated from a screenshot)
text_k10=1.03
; long names/stats that were cut scroll after marquee_delay_ms without mouse/wheel input, one character per step
marquee=1
marquee_delay_ms=2500
marquee_step_ms=160
marquee_hold_ms=1200
; skip effects from equipped items (duration type 3)
skip_equipped=1
; 1 = an EffectIcon (effecticon.2da) entry replaces the spell-table entry of the same spell
icon_source=1
; orange time for harmful effects and below soon_s seconds (needs the runtime colour check to pass at bind)
color_times=1
soon_s=30
discs=1
text_scale=1.0
fallback_icon=ip_mind
; debug aid: N synthetic test entries (alternating harmful/beneficial, 5 s .. 2 h + one permanent, every 3rd an item disc,
; entry 5 uses a missing texture) appended to the real list to exercise overflow, scrollbar and sorting; 0 = off
fake_rows=0
; 1 = log how the engine's blaster-deflection total compares with CombatStats.h (first 30 attacks, then mismatches; doc 51 ST4); 0 = hook returns at once
deflect_check=1
; 1 = click the panel header to switch Effects <-> Stats (combat stats: deflection, defense, resist, attack, crit, Force DC, alignment); 0 = no toggle, header stays "Active Effects"
stats_tab=1
; 1 = Stats tab shows an Influence row for party companions (0-100, neutral 50); 0 = hidden (default: influence is a spoiler)
show_influence=0
; 1 = hover a row of the character sheet (attributes, vitality, Force, Defense, saves, alignment, experience) for a tooltip; 0 = off
vanilla_tips=1
