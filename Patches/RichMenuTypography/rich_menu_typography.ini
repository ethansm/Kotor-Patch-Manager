[General]
InlineColoring=1
RichDescBox=1
StatHierarchy=1
SemanticColors=1
; 0 = no section dividers, 1 = between header|rules and rules|body, 2 = also between title and subtitle
DividerMode=1
; 1 = P2a probe: log the selected inventory item's name when a description is built (log only, max 160 lines); 0 = off
ProbeItemName=0
; 1 = the item description title row shows the selected item's name (needs RichDescBox=1); 0 = vanilla title
ItemNameTitle=1
BodyFont=fnt_d16x16
RulesFont=fnt_d16x16
; 1 = also log per-glyph and per-description box diagnostics; 0 keeps the log short
Verbose=0
; 1 = enable RMTPROBE logging (every populate); 0 = off (independent of Verbose)
ProbeRmt=0
