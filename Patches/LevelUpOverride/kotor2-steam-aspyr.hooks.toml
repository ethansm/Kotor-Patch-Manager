# ---- 0.3.0 M4 UI: character panel ctor 0x84C3A0, creation site (doc 08 "Phase 5 U facts" U1) ----
# 0x84D82C = `push 0x9A39DC` (push imm32 of "LBL_STATSBORDER" for the last InitControl 0x84D85D): one plain relocatable 5-byte instruction, statement boundary,
# nothing pending on the stack. The layout GFF is still open (StopLoadFromLayout is at 0x84D877), panel = [ebp-0x254]. skip_original_bytes=false: the
# framework relocates the push. 69 bytes before Mod 14's 0x84D871 hook; we only create (addToList=0) here, the append happens on the first SetStats tick.
[[hooks]]
