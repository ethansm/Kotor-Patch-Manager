# CSWSCreatureStats::LevelUp entry (doc 08 hook shortlist 1). thiscall(stats, pending*, addToList), ret 8.
# Prologue 55 8B EC 81 EC 80 00 00 00 = PUSH EBP / MOV EBP,ESP / SUB ESP,0x80 (9 bytes, whole instructions; 5 would cut the SUB).
# skip_original_bytes=false: our code runs BEFORE the original bytes, so EBP is still the caller's frame (used for the caller chain).
# Parameters: ECX = stats, [esp+0] = return address (flow id), [esp+4] = pending*, [esp+8] = addToList, EBP = caller frame.
[[hooks]]
address = 0x006B9870
type = "detour"
function = "LevelUpOverrideEntry"
original_bytes = [0x55, 0x8B, 0xEC, 0x81, 0xEC, 0x80, 0x00, 0x00, 0x00]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ecx"
type = "pointer"

[[hooks.parameters]]
source = "[esp+0]"
type = "pointer"

[[hooks.parameters]]
source = "[esp+4]"
type = "pointer"

[[hooks.parameters]]
source = "[esp+8]"
type = "int"

[[hooks.parameters]]
source = "ebp"
type = "pointer"

