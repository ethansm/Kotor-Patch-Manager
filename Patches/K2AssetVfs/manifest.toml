[patch]
id = "asset-vfs"
name = "In-Memory Asset VFS & Character Library"
version = "0.1.4-dev"
kind = "provider"
provides = ["k2.assetvfs@1", "k2.characterlib@1"]
author = "local"
description = "Provider for in-memory CExoResMan asset resolution (GetKeyEntry miss + ServiceFromImage hooks), load-time 2DA V2.b row splicing (CRes2DA::OnResourceServiced), and memory-backed Miles audio streams (InitializeSource hook + AIL file callbacks). Also a CExoResMan::Release hook (H5, VFS_OnResRelease) that skips the engine's source release for served packedIds; 5 hooks total in kotor2-steam-aspyr.hooks.toml. Exposes k2.assetvfs@1 and k2.characterlib@1. Config asset_vfs.ini [vfs] mode=serve|observe|off (default observe when missing: hooks only log what they would do and change nothing; set mode=serve to serve), log_prefix=, log_all=; legacy enabled=0 = off."

requires = []
requires_interfaces = []  # k2.npcworld@1 is optional: Spawn() polls it lazily and returns 0 without it
conflicts = []

[patch.supported_versions]
kotor2_steam_aspyr = "6A522E71631DCEE93467BD2010F3B23D9145326E1E2E89305F13AB104DBBFFEF"

[metadata]
target_versions = ["6A522E71631DCEE93467BD2010F3B23D9145326E1E2E89305F13AB104DBBFFEF"]
