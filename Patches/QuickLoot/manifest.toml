[patch]
id = "quick-loot"
name = "Quick Loot"
version = "0.8.0-dev"
author = "ethansm"
description = "Clicking a loot container takes everything at once with no container menu (doc 52 QL1a): ShowContainerGui is consumed (any show flag) and the vanilla take-all Close is sent a couple of HUD frames after the container script has run, with the Close flag chosen from the items actually present. QL1b: a one-line label lists what was taken (\"Took (5): Medpac x2, Blaster Pistol, +3 more\") for 3 seconds (3.5 s for a long list). QL2p: walking up to a loot container (within OpenM, 400 ms dwell) opens it as a peek and lists its contents on one line (\"[F] Take all (5): Medpac x2, Blaster Pistol, +3 more\") on a dark backing panel; press the take key (default F) to take everything, or walk away (past CloseM) and the items stay. Hold Shift to open the vanilla menu. QL2L (0.4.0-dev): the one-line list became a block on the vanilla teal frame (header + one row per item, names up to 40 chars, \" xN\" stacks, ListRows rows visible); the mouse wheel over the block scrolls it (gui-input) and a Took list stays up 3 s + 0.5 s per row past 3 (cap 6 s) and is held while the cursor is over it. QL2V (0.5.0-dev): the list is restyled like the vanilla inventory list: every item is a bordered row (teal, a small gap between rows, the HILIGHT tint under the cursor) twice as tall as before with the item icon at its left, and a vanilla-style scrollbar (arrows: one row, the track: one page) appears at the right when the list has more rows than ListRows. QL2A/QL4/QL8/QL7 (0.6.0-dev): the list is re-placed every frame from the target name tag (no latch; Anchor 0 under the name tag / 1 below the container / 2 beside the name tag), clicking an item row takes just that item (header flashes \"Acquired: <name>\"), hovering a row for 300 ms shows a tooltip with its description, and a Quick Loot page in Mod Configuration edits position, auto-open, list rows and open distance live. QL3 (0.8.0-dev): true hover peek on cursor hover (app+0x4B0) with 150ms dwell, debouncing, floating container title (CSWSPlaceable+0x268), list retention when cursor moves to the GUI widget, and doc 12 empty-container cursor indicator (SetMouseCursor 0x7B3870 id 1). Configured by quick_loot.ini [QuickLoot] Enabled, ProximityEnabled, HoverPeek, EmptyCursor, HoverDwellMs, OpenM, CloseM (default OpenM + 2), TakeKey, ScanMs, ListRows (default 4, 1..12), Anchor (default 0), GiveTags, HardwareBezels (default 1; QL15: the six hardware bezels are composed at first use from the installed game's own panel textures, no art ships), HideTargetArrow (default 1; hook H4 skips the target arrow while the list is up). Keeps the QL0 probe log lines and adds PEEK-/SCAN/SUPPRESS/LIST/SCROLL/WHEEL-SUB lines. Needs hud-host for the per-frame tick and gui-input for the wheel (without it the first rows are shown, no scrolling); mod-config is an optional soft dependency (Quick Loot page)."

requires = ["hud-host", "gui-input"]
requires_interfaces = ["k2.hud@1", "k2.guiinput@1"]
conflicts = []

