# Quick Loot hooks (doc 52): all four are detours: H1 0x7CACB0 ShowContainerGui (consumed, menu suppressed), H2 0x5F2FE0 placeable EventHandler, H3 0x5F5770 CloseInventory; H4 0x74FB20 target-arrow draw is skipped while the list is up. Logic changes are a DLL hot-swap; a new hook needs a KPM reinstall.
# Prologue bytes verified against ghidra_dumps/steam_6a522e71/decomp/{7c/007cacb0,5f/005f2fe0,5f/005f5770}.asm.
# None of the stolen bytes holds a relative branch or CALL.

# H1: CGuiInGame::ShowContainerGui 007cacb0 (thiscall, RET 8). ECX = gui, [esp+4] = container object id (client), [esp+8] = flag.
# Handler returns non-zero to consume (QL1): the prologue bytes run, then control jumps to the function's own epilogue
# (MOV ESP,EBP / POP EBP / RET 8 at 007cad1f). EAX carries the return value. The probe always returns 0 (run the original).
[[hooks]]
address = 0x007CACB0
type = "detour"
function = "QlShowContainer"
original_bytes = [0x55, 0x8B, 0xEC, 0x83, 0xEC, 0x0C, 0x89, 0x4D, 0xF4]
consumed_exit_address = 0x007CAD1F
exclude_from_restore = ["eax"]

[[hooks.parameters]]
source = "ecx"
type = "int"

[[hooks.parameters]]
source = "[esp+4]"
type = "int"

[[hooks.parameters]]
source = "[esp+8]"
type = "int"

# H2: CSWSPlaceable::EventHandler 005f2fe0 (thiscall, RET 20). ECX = placeable, [esp+4] = a1 (compared with DAT_0099244c),
