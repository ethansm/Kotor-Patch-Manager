# H4 (0.7.2-dev, doc 52 QL14): the target-arrow draw 0074fb20 (thiscall ECX = in-game GUI owner, one float frame-dt arg, RET 4; size 3146 B,
# one caller 0x0074b520; draws the hostilearrow / friendlyarrow sprite, recon .claude/waves/w8-52-QL14/r01.md). The arrow drew over the quick-loot
