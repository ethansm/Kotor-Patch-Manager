# Hook 1: Scene::DoFog (0x0046A980, __fastcall ECX = Scene; reached through the Scene vtable slot 0x128 at 0x0098BC6C)
# at 0x0046A989: CMP dword ptr [0x00A20064],0x0 (7 bytes, absolute operand, no relative branch). Handler first, then the
# stolen CMP, so the following JNZ sees its own flags. ECX still holds the Scene (stored to [EBP-0x3C] just before).
# The handler rescales Scene +0x64 (GL_FOG_START) / +0x68 (GL_FOG_END) from the remembered area values when fog is on.
# Does not overlap KPM Shader Fixes (0x0046AADD, fog-off branch) or K2 Grass Fog Fix (0x004665D8).
[[hooks]]
address = 0x0046A989
type = "detour"
function = "K2FogOnDoFog"
original_bytes = [0x83, 0x3D, 0x64, 0x00, 0xA2, 0x00, 0x00]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ecx"
type = "pointer"

# Hook 2 (0.1.1, R12 review 1.5a): Scene::SetFogRange (0x00464C80; virtual only, Scene::vftable 0x0098BB44 slot +0x44,
# no direct callers) at 0x00464C8A: FLD float ptr [EBP+0x8]; FSTP float ptr [EAX+0x64] (6 bytes, x87 stack empty, not a
# branch target). Handler first, then the stolen bytes. Reads [EBP-4] = Scene, [EBP+8] start, [EBP+0xC] end and records
# them as the area's vanilla fog, so DoFog never mistakes a new area for our own last write. The Scene ctor (0x00464500)
# writes its 5..40 m default directly; that case is a new Scene and is already handled.
[[hooks]]
address = 0x00464C8A
type = "detour"
function = "K2FogOnSetFogRange"
original_bytes = [0xD9, 0x45, 0x08, 0xD9, 0x58, 0x64]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "pointer"
