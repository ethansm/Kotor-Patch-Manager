# CSWGuiTargetActionMenu::PopulateMenus (0x00743540), detour at the prologue (no frame yet), so params are esp-relative:
# ecx = menu (hud + 0xCC), [esp+4] = leader, [esp+8] = forceUnusable (int), [esp+0xC] = target
[[hooks]]
address = 0x00743540
type = "detour"
function = "HH_TargetMenuPopulate"
original_bytes = [0x55, 0x8B, 0xEC, 0x83, 0xEC, 0x38]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ecx"
type = "pointer"

[[hooks.parameters]]
source = "[esp+4]"
type = "pointer"

[[hooks.parameters]]
source = "[esp+8]"
type = "int"

[[hooks.parameters]]
source = "[esp+0xC]"
type = "pointer"

# CSWGuiTargetActionMenu::PopulateMenus tail (0x00743847, hud-host 0.4.0): POP ESI / MOV ESP,EBP / POP EBP / RET 0xC (7 bytes),
# nothing branches into it. 0x743850 (called just before) has written the menu origin (+0x1648/+0x164C), so the origin is final
# here and nothing has been drawn yet. The hook runs first, then the stolen bytes (incl. the RET). Frame is still up:
# [ebp-0x30] = menu, [ebp+8] = leader, [ebp+0x10] = target (may be null). The old 0x00743850 entry hook read last frame's origin
# (one-frame lag, doc 31 CH4c). Design/RE: patch_manager_mods/31a_target_menu_post_re.md, doc 31 CH4c.
[[hooks]]
address = 0x00743847
type = "detour"
function = "HH_TargetMenuTail"
original_bytes = [0x5E, 0x8B, 0xE5, 0x5D, 0xC2, 0x0C, 0x00]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "[ebp-0x30]"
type = "pointer"

[[hooks.parameters]]
source = "[ebp+8]"
type = "pointer"

[[hooks.parameters]]
source = "[ebp+0x10]"
type = "pointer"

# CGuiInGame/HUD layout load (0x0040F5A0, StopLoadFromLayout entry, called by every panel ctor), detour at the prologue: ecx = panel.
# companion-selfheal used to own this hook (see companion_selfheal_src/kotor2-steam-aspyr.hooks.toml). The layout is still open
# while it runs, so the K2HUD_BUILD callbacks can create labels (guikit::createLabelFromTemplate).
[[hooks]]
address = 0x0040F5A0
type = "detour"
function = "HH_LayoutClosing"
original_bytes = [0x55, 0x8B, 0xEC, 0x83, 0xEC, 0x10]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ecx"
type = "pointer"
