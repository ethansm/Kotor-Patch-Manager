[patch]
id = "character-packs"
name = "Character Packs (K1 port .k2pack loader)"
version = "0.1.1-dev"
author = "local"
description = "Asset-free DLL-only client of asset-vfs: in KPatchInit (synchronously, so 2DA cells are in before the engine loads appearance/heads.2da) it loads every <game dir>/k1_imports/*.k2pack (one imported character per file: models, textures, UTC, DLG, audio, appearance/heads/soundset 2DA cells and the character definition; format in the project workspace), validates it, and registers it with k2.assetvfs@1 and k2.characterlib@1. A bad or oversized pack is skipped alone and logged; the shared asset-vfs pools (448 assets, 1024 2DA cells since asset-vfs 0.1.3-dev, 64 characters) are checked up front. The DLL contains no game assets and no hooks; packs are made on the user's machine by the project workspace build/install. Without a k1_imports directory it logs one line and does nothing."

requires = ["asset-vfs"]
requires_interfaces = ["k2.assetvfs@1", "k2.characterlib@1"]
conflicts = []

# Steam/LAA only. DLL-only patch: it owns no detour.
[patch.supported_versions]
kotor2_steam_aspyr = "6A522E71631DCEE93467BD2010F3B23D9145326E1E2E89305F13AB104DBBFFEF"
