[patch]
id = "load-hang-probe"
name = "Load Hang Probe"
version = "0.1.13"
author = "local"
description = "0.1.13: guard-only mode installs a crash catcher (CRASH report with module+offset, registers, stack return candidates and EBP chain in freeze_guard_history.txt; hangprobe_nocrash.txt disables); hangprobe_nodr.txt no longer blocks MAIN_STALL sampling. 0.1.12: the guarded activation fix (calls AppActivated 0x40BCF0 when the load screen stays up >= 6 s with the app-active flag 0 and the foreground window belongs to the game) now also runs without hangprobe_debug.txt; each action is written to freeze_guard_history.txt as ACTFIX; hangprobe_noactfix.txt disables it (11-20 Onderon movie hang). 0.1.11: the watchdog never suspends the main thread while the DR0 breakpoint is armed (11-14 Telos deadlock); fix=auto is now the default (fix=off disables) and acts when the foreground window belongs to the game process; the WndProc entry hook moved to k2-activation-fix. 0.1.10: without hangprobe_debug.txt only the GUARD runs (DR0 breakpoint, no hooks or watchdog); each guard fire and a 5-minute hit-count heartbeat persist to freeze_guard_history.txt in the game dir. 0.1.9 adds a GUARD: when the engine step loop at +aa949 would run forever (negative arr[i]-arr[j], the combat-unpause freeze) it stores +inf and resumes at +aa980 so the loop exits; hangprobe_nofix.txt disables it. 0.1.8 adds a DR0 execute breakpoint on the +aa916 division (ring of the last 64 passes in the stall report) and a hangprobe_stall.dmp minidump on MAIN_STALL (hangprobe_nodr.txt / hangprobe_nodump.txt disable). 0.1.7 adds the float-array dump (struct@[ebp-0xfa8]+0x98) to the stall report. 0.1.6 stall report adds registers, a frame dump and the float-loop decode, and tails the live mod logs (cmdq-probe, queue-hud, action-hotbar, companion-ai). 0.1.5 logs through KpLog.h (channel main, file load-hang-probe_log.txt; hangprobe_log.txt on an old core). Internal phase label 1.4.1 (doc 10 phase 5A, not a patch version) logs RestoreAfterMovie / PlayMovies-exit only when their values change (per-frame flood fix). Phase 1.4.0 adds 8 probe-log points for the load-hang activation path (WM_ACTIVATEAPP arrival with lParam, movie-thread deactivate/a1b76c/synthetic post, RestoreAfterMovie, PlayMovies exit/cut-off, MainLoop load-screen decision changes). Phase 1.3.0 adds window/activation logging (WndProc, AppActivated/Deactivated hooks) and an optional guarded re-activation fix (fix=auto). Phase 1.2.0 adds SetPlayerId (0x00798660) hook + file-I/O ring (IAT) + load timeline. Diagnostics: frame heartbeat on CClientExoAppInternal::MainLoop, watchdog that polls the load-screen state and samples the main thread's stack only when a hang looks likely and logs the load-screen state. The full probe runs only when hangprobe_debug.txt exists; the 0.1.9 guard runs without it and changes engine behaviour (stores +inf at +aa949 so the loop exits; hangprobe_nofix.txt disables). fix=auto is default ON since 0.1.11 when hangprobe_debug.txt exists (fix=off disables); it calls engine AppActivated 0x40BCF0. Writes load-hang-probe_log.txt (old core: hangprobe_log.txt), hangprobe_report.txt and freeze_guard_history.txt."

requires = []
conflicts = []

