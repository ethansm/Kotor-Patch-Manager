# Mouse Probe: read-only. Details: patch_manager_mods/18_mouse_camera_investigation.md "Engine-side findings".

# raw DIMOUSESTATE after GetDeviceState success: [ebp-0x14]=lX [ebp-0x10]=lY [ebp-0xC]=lZ [ebp-8]=buttons[4], this=[ebp-0x28]
[[hooks]]
address = 0x0072F14E
type = "detour"
function = "ProbeMouseRaw"
original_bytes = [0x8B, 0x45, 0xEC, 0xF7, 0xD8]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "pointer"

# end of PollMouseDelta: this+0x408/+0x40C = final normalised floats, this=[ebp-0x28]
[[hooks]]
address = 0x0072F2EC
type = "detour"
function = "ProbeMouseNorm"
original_bytes = [0x8B, 0x4D, 0xFC, 0x33, 0xCD]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "pointer"

# camera director per-frame, after GetMouseDelta: [ebp-0x30]=dx [ebp-0x50]=dy [ebp-0x84]=scale (floats), [ebp-0x130]=this
[[hooks]]
address = 0x0078C452
type = "detour"
function = "ProbeCameraFrame"
original_bytes = [0x8B, 0x0D, 0xA4, 0xB4, 0xA1, 0x00]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "pointer"
