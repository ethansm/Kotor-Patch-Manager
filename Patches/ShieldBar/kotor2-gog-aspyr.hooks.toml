# GOG Aspyr build. Hook addresses from patch_manager_mods/21b_gog_address_map.md section 1 (static-verified only: the hook
# windows are byte-identical to the Steam original_bytes below; untested live, GOG contributor testing required). Steam address -> GOG address
# is noted per hook. Function names, parameters and original_bytes are the same as kotor2-steam-aspyr.hooks.toml.
[metadata]
target_versions = ["777BEE235A9E8BDD9863F6741BC3AC54BB6A113B62B1D2E4D12BBE6DB963A914"]

# Portrait hover tooltip: RET path of FUN_00744c20 (text builder), 2 whole instructions (10 bytes, no jumps):
# mov ecx,[ebp-0xc] / mov fs:[0],ecx. [ebp-0x48] = charButton (this). Appends "Shield: cur/max" to the CExoString at this+0x1d4.
[[hooks]]
address = 0x005164EC   # Steam 0x00744EEC
type = "detour"
function = "AppendShieldToTooltip"
original_bytes = [0x8B, 0x4D, 0xF4, 0x64, 0x89, 0x0D, 0x00, 0x00, 0x00, 0x00]
exclude_from_restore = []

[[hooks.parameters]]
source = "[ebp-0x48]"
type = "int"
