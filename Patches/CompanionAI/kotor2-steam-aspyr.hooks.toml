# A1 Ranged/Stationary self-requeue: AIActionPhysicalAttacks approach branch, after ranged-ai E-H3 (0x6D850F) wrote
# the effective stance [EBP-0x174]. Stolen MOV [EBP-0x16C],0x7F000000 is EAX-free. Return 1 => 0x6D7D2F, the vanilla
# PC retarget tail ([EBP-0xE8] = new target or INVALID => InitializeNewAttackTarget / EndAttackAction).
