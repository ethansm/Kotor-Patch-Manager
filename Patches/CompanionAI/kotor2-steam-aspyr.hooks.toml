# companion-ai 0.2.0-probe. Windows validated by patch_manager_mods/mods678_research/check_windows.py (against the live
# hooks, ranged-ai, the inventory windows and each other; both executables byte-identical).
# Designs: patch_manager_mods/mods678_research/ai_review_2026-10-01/designs/design_ai_trace.md, design_ai_engine_fixes.md.
# Framework (KotorPatcher wrapper_x86.cpp): the stolen bytes run after the handler; for a consumed-exit hook EAX is
# excluded from the restore, so EAX = the handler result on both exits (both are EAX-dead, checked).

# ---------------------------------------------------------------- trace: VM command sites

# T1 ShipBuild value: ExecuteCommandShipBuild 0x692C40. [EBP-4] holds the value pushed at 0x692C5A; the handler
# writes 0 for traced scripts. Stolen MOV [0xA7E114],1 (write-only global) runs after it.
[[hooks]]
address = 0x00692C50
type = "detour"
function = "AiTraceShipBuild"
original_bytes = [0xC7, 0x05, 0x14, 0xE1, 0xA7, 0x00, 0x01, 0x00, 0x00, 0x00]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "int"

# T2 PrintString capture: ExecuteCommandPrintString 0x68F260, argc<2 path (all compiled calls). Stolen
# MOV [EBP-0x10],0 is EAX-free. Return 1 (engine_print=0 only) => 0x68F39F, the vanilla success tail (skips the
# engine's PRINTSTRING: format + sink write).
[[hooks]]
address = 0x0068F301
type = "detour"
function = "AiTracePrintString"
original_bytes = [0xC7, 0x45, 0xF0, 0x00, 0x00, 0x00, 0x00]
consumed_exit_address = 0x0068F39F
exclude_from_restore = ["eax"]

[[hooks.parameters]]
source = "ebp"
type = "int"

# T3 AurPostString capture: ExecuteCommandAurPostString 0x6F6200 (retail stub), after the four pops succeeded.
[[hooks]]
address = 0x006F62F2
type = "detour"
function = "AiTraceAurPostString"
original_bytes = [0xC7, 0x45, 0xCC, 0x00, 0x00, 0x00, 0x00]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "int"

