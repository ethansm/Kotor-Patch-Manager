; Inventory Sort & Filter 0.9.0-dev -- copy next to swkotor2.exe. Re-read at most once a second; no restart needed.
; Rollback: set a flag to 0 (takes effect at the next inventory refresh), or remove the patch id.
[Inventory]
; backpack order: new first, usable by the shown character, then by sort_order below
sort=1
; sort_order (commented = category): category = melee, ranged, armour/robes, other equippable, upgrades, consumables, misc, then base item and name
;   base = base item, then name (the 0.2.0 order) | name = item name only | vanilla = no sort (same as sort=0)
;   the digits 0..3 (category, base, name, vanilla) are accepted too
; sort_order=category
; items the shown character cannot equip get the red-orange "cannot use" colours
tint=1
; re-click the active All tab to cycle All -> New -> Can Equip -> Upgradeable -> All
cycle=1
cycle_states=new,usable,upgrade
; 0.4.0: own strip above the item list (filter state, sort order, "N of M shown"); the top caption is set by banner_shows_filter below.
; 0 = no strip, list untouched. Read when the inventory panel is built: a change applies the next time the game builds it.
strip=1
; 1 = the top "Filter" line names the active filter ("Filter: New") even with the strip on; 0 = it stays plain "Filter" (v4b). Needs cycle=1.
banner_shows_filter=1
; diagnostics: the shared KpLog logger (inventory-sort-filter_log.txt; kplog.ini [inventory-sort-filter] level=info|debug|trace),
; set in game under Options > Mod Configuration > Inventory Sort & Filter > Debug logging. The old log= / log_items= keys are ignored.
; compare: 1 by default (0.7.4); set 0 to hide the band. Also a mod-config row.
compare=1
