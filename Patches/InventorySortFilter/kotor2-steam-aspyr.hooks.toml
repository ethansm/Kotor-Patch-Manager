[metadata]
target_versions = ["6A522E71631DCEE93467BD2010F3B23D9145326E1E2E89305F13AB104DBBFFEF"]

# All four windows validated by patch_manager_mods/mods678_research/check_windows.py (both executables byte-identical).
# Doc: patch_manager_mods/11_inventory_sort_filter.md

# H6a: CSWGuiInGameInventory tab-click handler 008a8cf0 prologue. ECX = panel, [esp+4] = tab control.
# Handler returns non-zero to consume the click: the prologue bytes run, then control jumps to the
# function's own epilogue (MOV ESP,EBP / POP EBP / RET 4 at 008a8de2). EAX carries the return value.
[[hooks]]
address = 0x008A8CF0
type = "detour"
function = "SortFilterTabClick"
original_bytes = [0x55, 0x8B, 0xEC, 0x83, 0xEC, 0x14]
consumed_exit_address = 0x008A8DE2
exclude_from_restore = ["eax"]

[[hooks.parameters]]
source = "ecx"
type = "int"

[[hooks.parameters]]
source = "[esp+4]"
type = "int"

# H6b: PopulateItemListBox 008a7ba0, backpack loop, after CheckFilter passed. Replaces the reselect
# bookkeeping, the six pushes and the CALL CreateItemEntry (79 bytes, contains a relative CALL, so the
# bytes are skipped and never re-run). Resumes at 008a7e71 (JMP to the loop increment). EBP = frame.
[[hooks]]
address = 0x008A7E22
type = "detour"
function = "SortFilterBufferRow"
original_bytes = [
    0x8B, 0x55, 0xE8, 0x8B, 0x42, 0x14, 0x89, 0x45, 0x9C, 0x8B, 0x8D, 0x7C, 0xFF, 0xFF, 0xFF,
    0x8B, 0x91, 0xC8, 0x24, 0x00, 0x00, 0x3B, 0x55, 0x9C, 0x75, 0x16, 0x8B, 0x45, 0xC4, 0x89,
    0x45, 0xE0, 0x8B, 0x8D, 0x7C, 0xFF, 0xFF, 0xFF, 0xC7, 0x81, 0xC8, 0x24, 0x00, 0x00, 0x00,
    0x00, 0x00, 0x7F, 0x6A, 0x00, 0x6A, 0x00, 0x8B, 0x55, 0xE8, 0x52, 0x8D, 0x45, 0xD4, 0x50,
    0x8D, 0x4D, 0xC4, 0x51, 0x8B, 0x55, 0xC8, 0x52, 0x8B, 0x8D, 0x7C, 0xFF, 0xFF, 0xFF, 0xE8,
    0x7F, 0xF7, 0xFF, 0xFF,
]
skip_original_bytes = true
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "int"

# H6c: PopulateItemListBox 008a7ba0, loop exit, just before the finalise CALL 0041fc30. EBP = frame.
[[hooks]]
address = 0x008A7E76
type = "detour"
function = "SortFilterFlush"
original_bytes = [0x6A, 0x00, 0x6A, 0x01, 0x6A, 0x00, 0x8D, 0x45, 0xD4, 0x50, 0x8B, 0x8D, 0x7C, 0xFF, 0xFF, 0xFF, 0x81, 0xC1, 0x88, 0x05, 0x00, 0x00]
exclude_from_restore = []

[[hooks.parameters]]
