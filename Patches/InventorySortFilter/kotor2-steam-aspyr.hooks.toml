type = "int"

# H6d (0.2.0): row-select handler 008a83d0 epilogue (MOV ESP,EBP / POP EBP / RET 4; every path of the handler ends
# here, the three JZs to 008a8478 land on the window start). EBP = its frame, [ebp+8] = row. For a New item the
# handler has just re-run SetItem (via 008b1cc0), which rewrites the row colours; the hook puts the tint back.
# The stolen bytes end in RET 4: the wrapper restores ESP exactly, so they return to the caller as vanilla does.
[[hooks]]
address = 0x008A8478
type = "detour"
function = "SortFilterRowSelect"
original_bytes = [0x8B, 0xE5, 0x5D, 0xC2, 0x04, 0x00]
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "int"
