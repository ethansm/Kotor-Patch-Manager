; Voice Probe switch. Diagnostics only.
; 0 = off (default), 1 = log every ExecuteCommandPlaySound entry to voice_probe_log.txt.
[probe]
probe=0

; Hotkey trigger (0.2.0). Runs ONE named script with the PC as OBJECT_SELF on a fresh key press (game in foreground).
; key = Win32 virtual-key code in decimal (0 = off, default; 119 = F8). ctrl/shift = required modifiers.
; script = NCS resref (1-16 chars [A-Za-z0-9_], no extension); empty = off. The script must be loadable in the current module.
; Every fire logs one "TRIGGER #n ... ret=" line (needs probe logging: kplog.ini [voice-probe]).
[trigger]
key=0
ctrl=1
shift=0
cooldown_ms=1000
script=
