type = "pointer"

[[hooks.parameters]]
source = "[esp+0]"
type = "pointer"

[[hooks.parameters]]
source = "[esp+4]"
type = "pointer"

[[hooks.parameters]]
source = "[esp+8]"
type = "pointer"

[[hooks.parameters]]
source = "[esp+0xC]"
type = "pointer"

