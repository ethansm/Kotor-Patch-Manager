# Workbench Upgrade hooks (16). Every hook is an entry detour; probe handlers only read memory (SafeRead) and log, the switch/compare handlers also drive the UI.
# skip_original_bytes=false: our code runs BEFORE the original prologue bytes, so [esp+0] = return address and [esp+4..] = stack args.

# H1 FUN_00410530 GUI-manager push(panel,flags,closeFlag), thiscall ECX=manager, RET 0xC. Prologue PUSH EBP/MOV EBP,ESP/SUB ESP,8 (6 bytes, whole instructions).
