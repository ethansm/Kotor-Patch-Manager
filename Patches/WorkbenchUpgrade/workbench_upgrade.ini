[workbench_upgrade]
; Enable the BTN_SWITCH mode switch button on the Create and Upgrade screens (1 = enabled, 0 = disabled)
switch_button=1
; Enable crafting compare integration on the Create screen (1 = enabled, 0 = disabled)
crafting_compare=1
; Diagnostic verbose logging (1 = verbose probe dumps, 0 = concise lifecycle/switch events only)
verbose=0
; Open the upgrade/create screen directly, skipping the workbench dialog (1 = skip the dialog, 0 = show it)
skip_dialog=1
