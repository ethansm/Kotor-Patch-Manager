[patch]
id = "k2-robustness-fixes"
name = "Engine Robustness Fixes"
version = "1.0.0"
author = "local"
description = "Small engine robustness fixes from the KOTOR II engine research program (doc 10 Phase 6E), each independently switchable in robustnessfixes.txt (key=0 disables one, enabled=0 all): kt (resource key-table teardown leaves a dangling key-entry pointer that is later written to freed heap), vmid (negative NWScript command ids bypass the dispatch bounds check), sndri (Options > Sound apply with Force Software leaves Miles shut down until a second apply), netovf (oversized network message overruns the 2x64 KB send ring), guiid (huge control id in a .gui file pads the control list until allocation fails), abbound (action-bar list shrink copies past the new buffer). DLL-only; every site is byte-verified before writing and a mismatch skips only that fix. Log: robustnessfixes_log.txt."

requires = []
conflicts = []

