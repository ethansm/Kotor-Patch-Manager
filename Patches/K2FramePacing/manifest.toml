[patch]
id = "k2-frame-pacing"
name = "K2 Frame Pacing"
version = "0.1.0-dev"
author = "ethansm"
description = "Stops KOTOR II from spinning a full CPU core while minimized (the main loop has no sleep), caps the frame rate while the game is in the background (default 30 fps), and adds an optional FPS cap that sleeps instead of busy-waiting. Configured via k2_frame_pacing.ini or in-game Options -> Mod Configuration when mod-config is installed; logs PERF every 5 s."

requires = []
conflicts = []

