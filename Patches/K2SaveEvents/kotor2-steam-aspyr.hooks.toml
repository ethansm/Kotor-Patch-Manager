[metadata]
target_versions = ["6A522E71631DCEE93467BD2010F3B23D9145326E1E2E89305F13AB104DBBFFEF"]

# Byte-for-byte the five per-save hooks of Action Hotbar 1.2.1 (action_hotbar_src, doc 22 section 4.1). All are cdecl detours, the
# original bytes still run. No hook may be added at an address another installed patch hooks (KPM rejects it): do not install
# this next to a hotbar that still owns them.

# S1: CServerExoApp main loop (0x00533830) right after the only call of SaveGameInProgress (0x00534600, which writes the whole save
# synchronously: menu saves, quicksaves, timer autosaves). Stolen: push 0x993F4C (debug string). The DLL reads the folder from the
# save request itself (*(*(0xA1B4A4)+0x14)+0x18), so no parameters.
[[hooks]]
address = 0x00534527
type = "detour"
function = "SE_OnSaved"
original_bytes = [0x68, 0x4C, 0x3F, 0x99, 0x00]
skip_original_bytes = false
exclude_from_restore = []

# S2: DoPCAutosave (0x0053AF20, module-entry autosave to "000001 - AUTOSAVE", bypasses S1), epilogue after the save is written.
# Stolen: mov ecx,[ebp-0xC] / mov fs:[0],ecx (SEH frame restore).
[[hooks]]
address = 0x0053C5AA
type = "detour"
function = "SE_OnAutosaved"
original_bytes = [0x8B, 0x4D, 0xF4, 0x64, 0x89, 0x0D, 0x00, 0x00, 0x00, 0x00]
skip_original_bytes = false
exclude_from_restore = []

# L1: CServerExoAppInternal::LoadGame (0x0052FB80; every load menu / main menu / death screen / quickload path) after the save's
# party table and globals are read. [ebp-0x14] = CExoString "SAVES:NNNNNN - Name" (its char*). Stolen: mov eax,[ebp-0x58] /
# mov dword [eax+0x1F254],1.
[[hooks]]
address = 0x0052FD1E
type = "detour"
function = "SE_OnLoadRequest"
original_bytes = [0x8B, 0x45, 0xA8, 0xC7, 0x80, 0x54, 0xF2, 0x01, 0x00, 0x01, 0x00, 0x00, 0x00]
skip_original_bytes = false
exclude_from_restore = []

[[hooks.parameters]]
source = "[ebp-0x14]"
type = "pointer"

# L1b: LoadAutosaveSlot (0x008529E0) entry: PCAUTOSAVE entries load through here instead of LoadGame (folder "000001 - AUTOSAVE").
# Stolen: push ebp / mov ebp,esp / push -1.
[[hooks]]
address = 0x008529E0
type = "detour"
function = "SE_OnAutosaveSlotLoad"
original_bytes = [0x55, 0x8B, 0xEC, 0x6A, 0xFF]
skip_original_bytes = false
exclude_from_restore = []

# NG: entry of the chargen "start the new game" commit (0x008FACA0; only caller CSWGuiMainCharGen::BeginPlayGame 0x00907340 @0x00907355).
# Loads and module transitions never reach it. Stolen: push ebp / mov ebp,esp / push -1.
[[hooks]]
address = 0x008FACA0
type = "detour"
function = "SE_OnNewGame"
original_bytes = [0x55, 0x8B, 0xEC, 0x6A, 0xFF]
skip_original_bytes = false
exclude_from_restore = []
