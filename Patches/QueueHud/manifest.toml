[patch]
id = "queue-hud"
name = "Queue HUD"
version = "0.4.12-dev"
author = "ethansm"
description = "Shows the vanilla combat action-queue panel OUT of combat, so a use-item or cast-spell command given while paused stays visible while it waits for unpause. Buffers those commands, draws per-member queue strips and a Cancel control. Optional queue_hud.ini (see README.md). Needs portrait-slots and hud-host. Version history is in CHANGELOG.md."

requires = ["portrait-slots", "hud-host"]
requires_interfaces = ["k2.portraitslots@1", "k2.hud@1"]
conflicts = []

# Steam Aspyr only (static RE: 30_queue_hud_evidence/RE.md). Live builds since 10-16 (see PLAY_TEST_QUEUE.md); play rows pending. No GOG address map.
