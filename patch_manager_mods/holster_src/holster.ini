; holster.ini -- holster 0.4.0-dev (P0 probe + toggle key + shorter combat exit + per-body rotation). Read at game start; place, place_rot and place_off also reload while the game runs.
; A channel logs only when probe=1 AND its ch_ key is 1. Keep each comment on its own line.
; probe: master switch. 0 = every hook returns at once.
probe=0
; editor: 1 = the holster-editor patch (in-game Options screen) may register preview weapons and save placements here (needs no probe). 0 = off.
editor=1
; ch_comb: COMB lines (every call of the client combat-flag setter: creature, old, new, edge).
ch_comb=0
; ch_attach: ATTACH lines (in-world weapon attach: obj, tag rhand/lhand, creature, body object, hand handles).
ch_attach=0
; ch_swap: SWAP lines (weapon-set swap executor entry and first dwords of its object).
ch_swap=0
; ch_anim: ANIMRES lines (animation ids 0x2710..0x27FF only).
ch_anim=0
; ch_gob: GOB lines (sampled Gob attach-transform updates; heavy, enable only for a short run).
ch_gob=0
; gob_every: after the first 24 GOB samples, log every Nth update.
gob_every=600
; log_verbose: 0 (default) = rate-limited COMB/ATTACH/ANIMRES/PLACE/PLACEREFUSE lines (first few per creature or gob, then sparse samples, plus any change of
; the placement); 1 = the old per-sample volume. Read at game start only. WARN/ERR, CONFIG, BONETEST, MOUNT, HANDMAP, API and REG lines are never limited.
log_verbose=0
; max_lines: total log lines this probe writes per game run (all channels share it).
max_lines=3000
; bone_test: holster placement switch (needs probe=1). 1 = holster placement enabled (place_* below take effect); with place_mode=repoint it also repoints the
; right-hand weapon attach node to bone_name for EVERY creature (old P0 experiment), with place_mode=drawgate nothing is repointed. Default 0 (no game bytes touched).
bone_test=0
; place_mode: drawgate (default) = weapons keep the engine's native rhand/lhand attach and are written to the hip pose (bone_name / place_bone_*) only while
; their owner is NOT in combat (client combat flag 0) and no flourish is running; in combat they are in the hand, ~8 s after combat ends they snap back to the hip.
; Any unreadable state leaves the weapon in the hand. repoint = the old behaviour (escape hatch): the rhand/lhand attach node is repointed to bone_name, so
; weapons stay on the hip in combat too. Read at game start only. Needs probe=1 and bone_test=1.
; Drawgate only places weapon Gobs (model name "w_...") on the rhand/lhand nodes; the hand (left/right) comes from the node name. A custom bone_name (not in
; the known bone list: torsoUpr_g, torso_g, pelvis_g, rthigh_g, lthigh_g) has no mount in drawgate, so the weapon stays in the hand (repoint places it on that node).
place_mode=drawgate
; bone_name: default hip bone (letters, digits, underscore): the node a repointed weapon attaches to (place_mode=repoint), or the bone a holstered weapon is mounted on (drawgate). Try pelvis_g, rthigh_g, torsoUpr_g.
bone_name=pelvis_g
; bone_test_left: default 1 = also repoint the left-hand weapon attach node to bone_name, so a left weapon is holstered and mirrored like the right
; (needs bone_test=1; inert while bone_test=0). 0 = escape hatch: the lhand stays unpatched and that weapon stays in the hand. The editor preview
; always shows the left resolve (mirror + left_extra_rot, or explicit l_ keys), whatever this says. Read at game start only.
bone_test_left=1
; left_extra_rot: degrees about the bone X axis, default -8. A left weapon whose rotation is INHERITED from the right (no place_rot_l_* key
; for it) is mirrored (rx,-ry,-rz) and then tilted by this, so two back-mounted weapons cross as an X with the left one on top (rifle -8 = 2.9 cm
; between the barrels, -12 = 4.3 cm). 0 = plain mirror. Never applied to an explicit place_rot_l_<type> / place_rot_l_w_<model>. Clamped to +-45.
; Negative moves the left barrel away from the back; tune the sign live (reloads like place_rot). Per-type override: left_extra_rot_<type>.
left_extra_rot=-8
; left_extra_rot_rifle=-12
; ch_place: PLACE lines (log_verbose=0: first 3 per gob, every 200th, and on any change; log_verbose=1: first 24 placements, then every gob_every-th; placement itself works with ch_place=0).
ch_place=0
; place: 1 = move the weapon on bone_name by place_rot/place_off. Needs probe=1 and bone_test=1, otherwise nothing is written.
place=0
; place_rot: rotation in degrees about the bone x (right), y (forward), z (up), applied as Rz*Ry*Rx. Comma-separated. Edit while the game runs (reloads within 0.5 s).
place_rot=0,0,0
; place_off: offset in metres in the bone frame (x right, y forward, z up). Comma-separated. Edit while the game runs (reloads within 0.5 s).
place_off=0,0,0
; Per weapon type overrides: place_rot_<type> / place_off_<type>, type = lightsaber, melee, qstaff, pistol, rifle, heavy (from the weapon model
; name, e.g. w_SonicPstl_002 = pistol). A type without its own key uses place_rot / place_off. Reload live like place_rot.
; place_bone_<type>: mount that type on another bone of the same body (e.g. back = torsoUpr_g); offsets/rotation are then in that bone's frame.
; Live-tuned 10-16 (bone_test=1 pelvis_g; user approved sword look; rifle/heavy still tuning). Angles are Z*Y*X euler solved from a target
; blade/barrel direction plus "flat against the back": python3 scripts/holster_pose_solve.py blade|barrel --tilt --back [--side] [--mirror].
; place_rot=180,0,0                  (sabers/swords at the hip: blade down)
; place_off=0.20,0,0
; place_rot_pistol=-100,0,0
; place_bone_melee=torsoUpr_g        (diagonal, hilt over the right shoulder, tip toward the left hip, 8 deg off the back)
; place_rot_melee=-150,7,94
; place_off_melee=0.12,-0.10,0.22
; place_bone_rifle=torsoUpr_g        (grip at the right shoulder, barrel down-left, side flat on the back)
; place_rot_rifle=-60,4,93
; place_off_rifle=0.12,-0.11,0.20
; place_bone_heavy=torsoUpr_g        (vertical, centred, barrel down, grip/trigger pointing left)
; place_rot_heavy=-90,-3,-90
; place_off_heavy=0,-0.08,0.25
; place_bone_qstaff=torsoUpr_g        (UNTESTED example, not a shipped default: staff across the back; values copied from the melee example, not solved for a qstaff; tune with scripts/holster_pose_solve.py)
; place_rot_qstaff=-150,7,94
; place_off_qstaff=0.12,-0.10,0.22
; place_off_body_<name> / place_rot_body_<name>: per-body delta (name = body resref such as PFBCM, 1..16 chars [A-Za-z0-9_]) added to every weapon on that body.
; The rotation delta (degrees, |v| <= 720) is applied about the bone's own axes before the weapon rotation (q = qbase(delta) * qbase(rot)); the left hand uses the
; mirrored delta (y, z negated) and the offset delta with x negated. left_extra_rot stays outermost. The editor's "This body" scope writes both keys.
; 0.4.0-dev adds place_rot_body_<name>: an older holster DLL ignores it silently, so downgrading changes the placement on that body.
; place_gobvt: hex vtable address the weapon Gob must have (0x prefix optional). Blank or 0 = no check. Read at game start only.
place_gobvt=
; seeds (rest-pose previews, tune live): saber hip R pelvis_g 180,0,0 / 0.20,0,0 ; saber hip L 180,0,0 / -0.20,0,0
; pistol rthigh_g -90,0,0 / 0.12,0,-0.03 ; pistol lthigh_g -90,0,0 / -0.12,0,-0.03
; back (bone torsoUpr_g, raised + flush): carbine/rifle 45,0,-90 / -0.20,-0.09,-0.10 ; heavy 110,0,-25 / 0.03,-0.11,-0.10 ; double saber/staff 0,42,0 / -0.106,-0.06,-0.10
; ---- 0.3.0-dev: toggle key + shorter combat exit. Everything below is inert unless probe=1 AND bone_test=1 AND place_mode=drawgate. All keys start at game start only. ----
; toggle_key: Windows virtual-key code, decimal or 0x hex, 1..0xFE (0x77 = F8, the default). 0 = off. Pressing it while the weapons are holstered draws them (they
; stay in the hand for draw_hold_ms); pressing it while drawn stows them (the hold ends; after combat the stance countdown is ended too). A press while an enemy is
; within hostile_range of the drawn leader is refused. Only acts while the game window is in the foreground. The key is not consumed (the game still sees it).
toggle_key=0x77
; draw_hold_ms: how long a toggle-key draw keeps the weapons in the hand, in ms. 1000..60000; 0 = until the next press. Default 8000.
draw_hold_ms=8000
; combat_exit_ms: after this many ms of calm (no hostile within hostile_range) the engine's 8000 ms post-combat stance countdown is cut, so the weapons go back to the
; hip sooner. 200..7800; 0 = off (vanilla 8 s). Default 1500.
combat_exit_ms=1500
; flourish_exit_ms: same for a flourish-only stance (the draw flourish that never sets the client combat flag). 200..7800; 0 = off. Default 1500.
flourish_exit_ms=1500
; flourish_draw: 1 = a party member's weapon stays in the hand while the player's Flourish stance is open (alert stance without the client combat flag, up to the
; engine's 8 s countdown or flourish_exit_ms); 0 = old behaviour (hip during a flourish). Party members only. The window is "alert stance without combat flag", so
; equipping a weapon from the inventory can also draw it for up to ~1.5 s. Default 1.
flourish_draw=1
; draw_slide_ms / stow_slide_ms: a weapon eases between the hip and the hand over this long instead of snapping. draw_slide_ms 0..570 (570 ms is the vanilla draw window),
; stow_slide_ms 0..1000; 0 = instant for that direction, so 0 and 0 is exactly the 0.5.0 snap. A reversal part-way takes the matching share of the time.
; (0.15.0-dev) Per weapon type, built in as draw ms / stow ms: pistol 300 / 350, lightsaber 350 / 350, melee 520 / 600, rifle 520 / 600, heavy 570 / 700, qstaff 570 / 700.
; Resolution order: draw_slide_ms_<type> > draw_slide_ms (when set) > the built-in value above. The global lines below are commented out so the per-type defaults apply;
; uncomment one to give EVERY type that time. A value outside its range is clamped and logged as an "ini ... ignored: out of range: used clamped" line at start-up.
;draw_slide_ms=350
;stow_slide_ms=350
;draw_slide_ms_pistol=300
;stow_slide_ms_pistol=350
;draw_slide_ms_heavy=570
;stow_slide_ms_heavy=700
; slow_holster_x: (0.21.0-dev, HW44) slow motion for every draw / stow, to watch the paths: 1 = normal (default), 4 = four times slower. 1..8, whole or decimal numbers
; ("4" or "2.5"); below 1 is 1, above 8 is 8 (logged), junk or nan is 1. The Options "Slow holster" row writes this key. It multiplies the slide ms above (global, per-type and
; built-in alike) after their caps, so a slowed slide may pass 570 / 1000 ms (heavy stow 700 x 4 = 2800 ms), and the windows that shape the carry follow it (reach_resid_ms
; residual, the reversal fade, dual_stagger_ms), so the weapon takes the same path, just slower. Path-share windows (reach_grab_pct, reach_stow_land_f, reach_stow_rot_f) already
; scale with the slide. NOT scaled: the hold / cut timers (move_hold_ms, combat_exit_ms, draw_hold_ms) and the engine's own wield / unwield clips, which stay real time.
; LIVE: unlike the keys above it is re-read on every ini reload (500 ms poll, or the editor's Save), but the reload and the slides only run with probe=1 (and bone_test=1,
; place_mode=drawgate), so a change needs those on. A slide that has started keeps its length; the next draw / stow uses the new value.
; Log: CONFIG slowx= at start-up, "SLOWX old->new" on a live change, and slowx= on each SLIDE start (only when not 1); dly= is the scaled stagger.
slow_holster_x=1
; snap_log_m: (0.21.1-dev, log only) SNAP detector: a "SNAP gob= ... why=" line when a weapon moves more than this many metres in ONE frame during a running draw / stow (or on the frame after it ends)
; AND more than 4x the previous frame's step, so slow smooth motion never triggers. 0 = off, default 0.05, max 2, junk = default. Boot-time. At most 80 SNAP lines per session for normal-speed slides and another 80 for slowed ones (a "SNAP cap reached slowed|normal" line marks the cap). why= names the path that
; produced the jump (write, noin, release, reset-first, reset-unread, refuse:<code>, cut:retarget); read it with scripts/holster_log_check.py (SNAP summary line, --row SM-L17). Changes no pose.
;snap_log_m=0.05
; hostile_range: distance in world units (metres, hull gap) of the engine's nearest-enemy scan; an enemy this close keeps the stance. 5.0..60.0, default 30.0.
hostile_range=30.0
; hostile_backoff_ms: wait between two enemy scans of the same party member while an enemy is near. 250..5000 ms, default 1000.
hostile_backoff_ms=1000
; move_hold_ms: the shorter exit above never cuts the stance of a party member that is walking or running, nor for this many ms after it stops, so a flourish started
; standing still stays in the hand while you move. 0..10000; 0 = off (old behaviour: the cut can fire mid-walk). Default 1500.
move_hold_ms=1500
; party_combat_hold: 1 = while ANY party member's client combat flag is set, every party member's weapons stay in the hand (the flag is per creature, so one
; member's brief drop out of combat no longer stows the others mid-fight); 0 = old behaviour (each member follows its own flag). Default 1.
party_combat_hold=1
; unarmed_anim: 1 = (0.13.0-dev, hook H4b) a party member whose weapon sits on the hip (not in combat) resolves its walk / run clips as UNARMED, so a rifle, heavy or
; dual-wield carrier no longer runs around holding an invisible weapon. Attacks, ranged shots and flourishes are untouched (they read the real weapon style). Needs probe=1,
; bone_test=1 and place_mode=drawgate (the holstered state comes from the drawgate placement); read once at game start (not live-reloaded). 0 = the 0.11 behaviour. Default 1.
; With ch_anim=1: ANIMSTYLE lines (first 40 overrides) and ANIMRES lines with hol=1 for locomotion ids.
; (0.16.0-dev) The animation resolver hands over the creature's BODY object; before this version the set lookup used it as the creature and never matched (ANIMRES hol=0, no override, no move hold). ANIMRES lines now end with own=<creature>.
unarmed_anim=1
; reach_test: PROBE (0.7.0-dev). 1 = while a weapon slides between the hip and the hand, the owner's RIGHT arm (bicep + forearm rotations) bends so the hand chases the
; weapon; REACH lines in the log (ch_main) show wrote= and persist= (0 = the engine resamples the arm each frame, which the write needs). Needs probe=1, bone_test=1,
; place_mode=drawgate and a non-zero draw_slide_ms / stow_slide_ms. Both hands (the left-hand weapon bends the left arm). Default 0 = no arm writes.
; (0.14.0-dev) REACH ... hold=N: this solve follows N frames (max 3) where a transient refusal (read / pose / solve) re-applied the last arm; "REACH ... hold=N why=" lines are the held frames.
reach_test=0
; reach_carry: 1 = (needs reach_test=1) the weapon rides the real hand while it is drawn or holstered: the hand swings between the mount and its normal position and the blade goes with it,
; spinning with the wrist (draw: over the shoulder for a high mount, then forward and down; holster: the reverse). 0 = the weapon slides on its own line and the arm chases it (0.7.x). Default 1.
reach_carry=1
; reach_hinge: 1 = (needs reach_carry=1) a BACK mount (upper back / back) is reached by a hinged arm: the arm first takes an L shape (upper arm down, forearm forward),
; pitches up with the elbow locked at 90 deg until the upper arm points forward and the forearm straight up, then the upper arm stays parked while the forearm closes back over
; the shoulder onto the weapon (the elbow lifts up when the mount sits behind the shoulder). The carry is the exact reverse, then the arm settles into its animation pose.
; Only for a mount at about shoulder height or higher (a mid / low back mount keeps the bowed line: the elbow would flip as the hand passes the shoulder).
; 0 = the bowed line of 0.10.0-dev. Hip mounts always use the bowed line. Default 1.
reach_hinge=1
; reach_grab_pct: 0..60 (needs reach_carry=1). The share of a draw spent reaching up and back to grab the weapon (it stays on the mount until the hand is there), and of a stow spent letting go
; and bringing the hand back; the rest is the swing that carries it. 0 = no separate reach / release phase.
; (0.15.0-dev) Per weapon type, built in: pistol 30, lightsaber 30, melee 45, rifle 45, heavy 45, qstaff 45. reach_grab_pct_<type> > reach_grab_pct (when set) > the built-in value.
;reach_grab_pct=30
;reach_grab_pct_rifle=45
; reach_wrist_pct / reach_wrist_max_deg: the hand bone is turned from the weapon's mount orientation (at the grab and the landing) to its resting orientation, so the blade swings with the
; wrist instead of keeping the hand's orientation (and clipping the head). pct 0..100 scales the turn (0 = no wrist rotation), max_deg 0..180 limits it. Defaults 100 and 60
; (0.15.0-dev: 90 -> 120; 0.17.0-dev: 120 -> 60 because the forearm now takes the roll, see reach_twist_deg).
reach_wrist_pct=100
reach_wrist_max_deg=60
; reach_twist_deg: (0.17.0-dev) the part of the wrist turn about the forearm axis (elbow to hand) is a forearm roll, limited to this many degrees (0..120); the rest, the swing across
; the axis, stays on the wrist (reach_wrist_max_deg). Default 80. 0 = no forearm twist; with reach_wrist_max_deg=120 this restores 0.15/0.16 behaviour.
;reach_twist_deg=80
; reach_extract_pct_back / reach_extract_pct_hip: (0.18.0-dev) share of the carry (0..0.5) spent lifting the weapon out of its mount along its own long axis before it turns toward the hand
; (the stow is the reverse). Back mounts (hinge / over-the-shoulder reach) use _back, every other mount uses _hip. Needs reach_test=1 and reach_carry=1. 0 = no lift, the 0.17 path exactly.
; Weapons whose exit direction is unknown (guns, sabers, staffs) are not lifted; they still hold the mount orientation through the share.
;reach_extract_pct_back=0.20
;reach_extract_pct_hip=0.10
; reach_exit_sign_<lightsaber|melee|qstaff|pistol|rifle|heavy> / reach_exit_len_<...>: (0.19.0-dev) per-category override of the exit direction (-1, 0, 1 or auto) and length (0..0.5 m or auto)
; of the extract lift. auto (default) = the per-model table (HolsterShape). 1 / -1 lifts along +/- the weapon's long axis even for a model the table has no exit for (length: the override,
; else the table's, else 0.15 m); 0 turns the lift off for that category. Needs reach_test=1, reach_carry=1 and an extract share above 0. CONFIG exit= lists the ones that are set.
;reach_exit_sign_rifle=auto
;reach_exit_len_rifle=auto
; dual_stagger_ms: (0.19.0-dev) 0..200, default 60. The left-hand weapon of a dual wielder starts its draw / stow this many ms after the right-hand one, so the two hands do not move
; in lockstep. 0 = both together (the 0.18 behaviour). SLIDE start lines gain dly=<ms> when a delayed start fires.
;dual_stagger_ms=60
; party_jitter_ms: (0.19.0-dev) 0..60, default 0 (off). A further fixed 0..N ms per party member (hash of its id; not the controlled creature), so the party does not draw in lockstep.
;party_jitter_ms=0
; log_mount: (0.19.0-dev) 1 = MOUNT gob= lines on the main channel (weapon, mount bone, bone / mount / owner-facing quats; once per rest, on a change, and at most every 5 s per weapon). log_verbose=1 also
; enables it. For scripts/holster_log_check.py --mounts. Default 0.
;log_mount=0
; reach_via_<lightsaber|melee|qstaff|pistol|rifle|heavy>: (0.18.0-dev) 1 = the weapon's turn goes through "long axis pointing up" on the way to the hand. Code default 0 for every category; this file sets melee, rifle and heavy to 1:
; untested: see play rows SM-L12 and SM-L15. heavy has no play pass yet (patch_manager_mods/42c_smooth_holstering_master_plan.md HW50). Acts only with reach_test=1 and reach_carry=1 (this template ships reach_test=0). (0.20.0-dev) The via also shapes the hand-frame residual of a normal draw / stow now (Rres -> via -> hand), not only reversals and partial slides.
reach_via_melee=1
reach_via_rifle=1
reach_via_heavy=1
; reach_via_out_m: (0.20.0-dev) 0..0.30 m, default 0.12. While reach_via_<cat> is on, the hand target is pushed this far outward (right arm +x, left arm -x of the body) at the via (peaks when the weapon passes "up"),
; 0 at both ends, so the weapon turned through "up" clears the body. 0 = no offset.
;reach_via_out_m=0.12
; reach_via_out_m_<lightsaber|melee|qstaff|pistol|rifle|heavy>: (0.21.2-dev) 0..0.30 m, per-category outward via offset. Unset = the global reach_via_out_m above (no change); 0 = no offset for that category.
reach_via_out_m_rifle=0.20
; reach_ease_soft_<lightsaber|melee|qstaff|pistol|rifle|heavy>: (0.21.4-dev, HW50) 0|1, default 0. 1 = the carry eases in and out smoothly (the hand slows down and settles at the end of a draw, and starts slowly on a stow)
; instead of the default short ease that stops the hand dead. Read at game start only (restart after a change). Needs reach_test=1 and reach_carry=1.
;reach_ease_soft_rifle=1
; reach_via_tilt_deg_<lightsaber|melee|qstaff|pistol|rifle|heavy>: (0.21.4-dev, HW50) 0..90 degrees, default 0. While reach_via_<cat>=1, the via aims the weapon's long axis straight up; this tilts that "up" toward the body's forward by this many degrees,
; so the via turn (and the extra roll) is smaller while keeping part of its head clearance. 0 = today's via exactly; 90 = aims forward (no head clearance from the via). Read at game start only.
; Needs reach_test=1, reach_carry=1 and reach_via_<cat>=1. Measured on the model, for a rifle on the back pointing near straight down the whole via turn is about 267 deg at tilt 0, 183 at 45, 93 at 90; 45 roughly halves the extra turn.
; Play row SM-L19 checks it.
;reach_via_tilt_deg_rifle=45
; reach_stow_land_f: (0.20.3-dev) 0 or 0.02..0.5, default 0.15. A STOW keeps the weapon on the hand until the hand is within this fraction of the path to the mount, then lands it on the mount.
; 0 = the old time-based landing (reach_resid_ms before the carry ends). Default 0.15 = the weapon stays on the hand until the hand is within 15% of the path to the mount. Draw is unchanged.
;reach_stow_land_f=0.15
; reach_stow_rot_f: (0.20.4-dev) 0.02..1.0, default 0.6; 0 = the weapon turns over the same last reach_stow_land_f of the path as it lands (the 0.20.3 behaviour, which flipped a sword through the body at the very end). In a STOW the weapon turns toward its mount orientation over the last this-much of the hand path while the hand carries it back (with reach_via_<cat>=1 the turn goes through "long axis up", over the shoulder); the position still lands in the last reach_stow_land_f. Ignored when reach_stow_land_f is 0.
;reach_stow_rot_f=0.6
; reach_pole_from_grip: (0.20.0-dev) 0..1, default 0 (off). Hip / Thigh reaches only: the elbow pole turns toward the side the forearm lies when the hand holds the weapon at its mount, fading out by
; 30% of the path. 1 = the full reach_pole_bias_deg. reach_pole_bias_deg: 0..90, default 20, the largest turn. REACH lines log vo= (via offset, m) and pb= (pole turn, deg).
;reach_pole_from_grip=0
;reach_pole_bias_deg=20
; reach_resid_ms: (0.15.0-dev) a carried draw keeps the weapon's mount orientation and position relative to the HAND at the first carry frame and unwinds that offset over this many ms
; (a holster lands on the mount the same way over its last ms), so a big grab angle no longer shows as a spin. 0..600; 0 = the old world blend of the first 15% of the carry. Default 240.
;reach_resid_ms=240
; reach_hinge_out_<lightsaber|melee|qstaff|pistol|rifle|heavy>=outT,outPole: (0.15.0-dev) the hinged back reach's outward hand offset (0..1, forearm lengths) and outward share of the parked elbow
; pole (0..2). Defaults 0.10,0.25 for every type except heavy 0.10,0.45 (a wider sweep). Interim values. Uncomment to tune.
;reach_hinge_out_heavy=0.10,0.45
; reach_bulge_<lightsaber|melee|qstaff|pistol|rifle|heavy>=up,forward,outward: how far the hand path bows away from the straight mount-to-hand line for a high mount, in arm lengths. Swords
; swing up and forward (0.20,0.40,0.10); heavy weapons go straight up and out (0.60,0.10,0.25) to clear the head. Uncomment to tune.
;reach_bulge_heavy=0.60,0.10,0.25
; reach_pole_<hip|over>_<lightsaber|melee|qstaff|pistol|rifle|heavy>=x,y,z: which way the elbow bends while the hand reaches (RIGHT arm, body frame: x right, y forward, z up; the left arm
; mirrors x). "hip" applies to a mount at the waist, "over" to a mount at or above the shoulder (blended by mount height). Defaults, e.g. melee: hip 0.6,-0.4,-0.4 (elbow back, out, down),
; over 0.5,0.0,0.85 (elbow up and out: the hand goes up and over the shoulder to the hilt). Uncomment to tune; log lines REACH ... u= lt= show the blend and the target in the body frame.
;reach_pole_over_melee=0.5,0.0,0.85
;reach_pole_hip_pistol=0.5,-0.7,-0.2
; delay_party: 1 = the shorter exit applies to every party member (up to 3), 0 = the controlled creature only. Default 1.
delay_party=1
; ch_toggle: TOGGLE lines (key edge, draw / stow / refused), DELAY lines (a cut: slot, before, elapsed, kind) and HOSTILE lines (duration of the first 20 enemy scans). Needs probe=1.
ch_toggle=0
