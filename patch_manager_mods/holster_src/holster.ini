; holster.ini -- holster 0.4.0-dev (P0 probe + toggle key + shorter combat exit + per-body rotation). Read at game start; place, place_rot and place_off also reload while the game runs.
; A channel logs only when probe=1 AND its ch_ key is 1. Keep each comment on its own line.
; probe: master switch. 0 = every hook returns at once.
probe=0
; editor: 1 = the holster-editor patch (in-game Options screen) may register preview weapons and save placements here (needs no probe). 0 = off.
editor=1
; ch_comb: COMB lines (every call of the client combat-flag setter: creature, old, new, edge).
ch_comb=0
; ch_attach: ATTACH lines (in-world weapon attach: obj, tag rhand/lhand, creature, body object, hand handles).
ch_attach=0
; ch_swap: SWAP lines (weapon-set swap executor entry and first dwords of its object).
ch_swap=0
; ch_anim: ANIMRES lines (animation ids 0x2710..0x27FF only).
ch_anim=0
; ch_gob: GOB lines (sampled Gob attach-transform updates; heavy, enable only for a short run).
ch_gob=0
; gob_every: after the first 24 GOB samples, log every Nth update.
gob_every=600
; log_verbose: 0 (default) = rate-limited COMB/ATTACH/ANIMRES/PLACE/PLACEREFUSE lines (first few per creature or gob, then sparse samples, plus any change of
; the placement); 1 = the old per-sample volume. Read at game start only. WARN/ERR, CONFIG, BONETEST, MOUNT, HANDMAP, API and REG lines are never limited.
log_verbose=0
; max_lines: total log lines this probe writes per game run (all channels share it).
max_lines=3000
; bone_test: holster placement switch (needs probe=1). 1 = holster placement enabled (place_* below take effect); with place_mode=repoint it also repoints the
; right-hand weapon attach node to bone_name for EVERY creature (old P0 experiment), with place_mode=drawgate nothing is repointed. Default 0 (no game bytes touched).
bone_test=0
; place_mode: drawgate (default) = weapons keep the engine's native rhand/lhand attach and are written to the hip pose (bone_name / place_bone_*) only while
; their owner is NOT in combat (client combat flag 0) and no flourish is running; in combat they are in the hand, ~8 s after combat ends they snap back to the hip.
; Any unreadable state leaves the weapon in the hand. repoint = the old behaviour (escape hatch): the rhand/lhand attach node is repointed to bone_name, so
; weapons stay on the hip in combat too. Read at game start only. Needs probe=1 and bone_test=1.
; Drawgate only places weapon Gobs (model name "w_...") on the rhand/lhand nodes; the hand (left/right) comes from the node name. A custom bone_name (not in
; the known bone list: torsoUpr_g, torso_g, pelvis_g, rthigh_g, lthigh_g) has no mount in drawgate, so the weapon stays in the hand (repoint places it on that node).
place_mode=drawgate
; bone_name: default hip bone (letters, digits, underscore): the node a repointed weapon attaches to (place_mode=repoint), or the bone a holstered weapon is mounted on (drawgate). Try pelvis_g, rthigh_g, torsoUpr_g.
bone_name=pelvis_g
; bone_test_left: default 1 = also repoint the left-hand weapon attach node to bone_name, so a left weapon is holstered and mirrored like the right
; (needs bone_test=1; inert while bone_test=0). 0 = escape hatch: the lhand stays unpatched and that weapon stays in the hand. The editor preview
; always shows the left resolve (mirror + left_extra_rot, or explicit l_ keys), whatever this says. Read at game start only.
bone_test_left=1
; left_extra_rot: degrees about the bone X axis, default -8. A left weapon whose rotation is INHERITED from the right (no place_rot_l_* key
; for it) is mirrored (rx,-ry,-rz) and then tilted by this, so two back-mounted weapons cross as an X with the left one on top (rifle -8 = 2.9 cm
; between the barrels, -12 = 4.3 cm). 0 = plain mirror. Never applied to an explicit place_rot_l_<type> / place_rot_l_w_<model>. Clamped to +-45.
; Negative moves the left barrel away from the back; tune the sign live (reloads like place_rot). Per-type override: left_extra_rot_<type>.
left_extra_rot=-8
; left_extra_rot_rifle=-12
; ch_place: PLACE lines (log_verbose=0: first 3 per gob, every 200th, and on any change; log_verbose=1: first 24 placements, then every gob_every-th; placement itself works with ch_place=0).
ch_place=0
; place: 1 = move the weapon on bone_name by place_rot/place_off. Needs probe=1 and bone_test=1, otherwise nothing is written.
place=0
; place_rot: rotation in degrees about the bone x (right), y (forward), z (up), applied as Rz*Ry*Rx. Comma-separated. Edit while the game runs (reloads within 0.5 s).
place_rot=0,0,0
; place_off: offset in metres in the bone frame (x right, y forward, z up). Comma-separated. Edit while the game runs (reloads within 0.5 s).
place_off=0,0,0
; Per weapon type overrides: place_rot_<type> / place_off_<type>, type = lightsaber, melee, qstaff, pistol, rifle, heavy (from the weapon model
; name, e.g. w_SonicPstl_002 = pistol). A type without its own key uses place_rot / place_off. Reload live like place_rot.
; place_bone_<type>: mount that type on another bone of the same body (e.g. back = torsoUpr_g); offsets/rotation are then in that bone's frame.
; Live-tuned 10-16 (bone_test=1 pelvis_g; user approved sword look; rifle/heavy still tuning). Angles are Z*Y*X euler solved from a target
; blade/barrel direction plus "flat against the back": python3 scripts/holster_pose_solve.py blade|barrel --tilt --back [--side] [--mirror].
; place_rot=180,0,0                  (sabers/swords at the hip: blade down)
; place_off=0.20,0,0
; place_rot_pistol=-100,0,0
; place_bone_melee=torsoUpr_g        (diagonal, hilt over the right shoulder, tip toward the left hip, 8 deg off the back)
; place_rot_melee=-150,7,94
; place_off_melee=0.12,-0.10,0.22
; place_bone_rifle=torsoUpr_g        (grip at the right shoulder, barrel down-left, side flat on the back)
; place_rot_rifle=-60,4,93
; place_off_rifle=0.12,-0.11,0.20
; place_bone_heavy=torsoUpr_g        (vertical, centred, barrel down, grip/trigger pointing left)
; place_rot_heavy=-90,-3,-90
; place_off_heavy=0,-0.08,0.25
; place_off_body_<name> / place_rot_body_<name>: per-body delta (name = body resref such as PFBCM, 1..16 chars [A-Za-z0-9_]) added to every weapon on that body.
; The rotation delta (degrees, |v| <= 720) is applied about the bone's own axes before the weapon rotation (q = qbase(delta) * qbase(rot)); the left hand uses the
; mirrored delta (y, z negated) and the offset delta with x negated. left_extra_rot stays outermost. The editor's "This body" scope writes both keys.
; 0.4.0-dev adds place_rot_body_<name>: an older holster DLL ignores it silently, so downgrading changes the placement on that body.
; place_gobvt: hex vtable address the weapon Gob must have (0x prefix optional). Blank or 0 = no check. Read at game start only.
place_gobvt=
; seeds (rest-pose previews, tune live): saber hip R pelvis_g 180,0,0 / 0.20,0,0 ; saber hip L 180,0,0 / -0.20,0,0
; pistol rthigh_g -90,0,0 / 0.12,0,-0.03 ; pistol lthigh_g -90,0,0 / -0.12,0,-0.03
; back (bone torsoUpr_g, raised + flush): carbine/rifle 45,0,-90 / -0.20,-0.09,-0.10 ; heavy 110,0,-25 / 0.03,-0.11,-0.10 ; double saber/staff 0,42,0 / -0.106,-0.06,-0.10
; ---- 0.3.0-dev: toggle key + shorter combat exit. Everything below is inert unless probe=1 AND bone_test=1 AND place_mode=drawgate. All keys start at game start only. ----
; toggle_key: Windows virtual-key code, decimal or 0x hex, 1..0xFE (0x77 = F8, the default). 0 = off. Pressing it while the weapons are holstered draws them (they
; stay in the hand for draw_hold_ms); pressing it while drawn stows them (the hold ends; after combat the stance countdown is ended too). A press while an enemy is
; within hostile_range of the drawn leader is refused. Only acts while the game window is in the foreground. The key is not consumed (the game still sees it).
toggle_key=0x77
; draw_hold_ms: how long a toggle-key draw keeps the weapons in the hand, in ms. 1000..60000; 0 = until the next press. Default 8000.
draw_hold_ms=8000
; combat_exit_ms: after this many ms of calm (no hostile within hostile_range) the engine's 8000 ms post-combat stance countdown is cut, so the weapons go back to the
; hip sooner. 200..7800; 0 = off (vanilla 8 s). Default 1500.
combat_exit_ms=1500
; flourish_exit_ms: same for a flourish-only stance (the draw flourish that never sets the client combat flag). 200..7800; 0 = off. Default 1500.
flourish_exit_ms=1500
; flourish_draw: 1 = a party member's weapon stays in the hand while the player's Flourish stance is open (alert stance without the client combat flag, up to the
; engine's 8 s countdown or flourish_exit_ms); 0 = old behaviour (hip during a flourish). Party members only. The window is "alert stance without combat flag", so
; equipping a weapon from the inventory can also draw it for up to ~1.5 s. Default 1.
flourish_draw=1
; draw_slide_ms / stow_slide_ms: a weapon eases between the hip and the hand over this long instead of snapping. draw_slide_ms 0..570 (570 ms is the vanilla draw window),
; stow_slide_ms 0..1000; 0 = instant for that direction, so 0 and 0 is exactly the 0.5.0 snap. A reversal part-way takes the matching share of the time. Default 350 each.
draw_slide_ms=350
stow_slide_ms=350
; hostile_range: distance in world units (metres, hull gap) of the engine's nearest-enemy scan; an enemy this close keeps the stance. 5.0..60.0, default 30.0.
hostile_range=30.0
; hostile_backoff_ms: wait between two enemy scans of the same party member while an enemy is near. 250..5000 ms, default 1000.
hostile_backoff_ms=1000
; move_hold_ms: the shorter exit above never cuts the stance of a party member that is walking or running, nor for this many ms after it stops, so a flourish started
; standing still stays in the hand while you move. 0..10000; 0 = off (old behaviour: the cut can fire mid-walk). Default 1500.
move_hold_ms=1500
; party_combat_hold: 1 = while ANY party member's client combat flag is set, every party member's weapons stay in the hand (the flag is per creature, so one
; member's brief drop out of combat no longer stows the others mid-fight); 0 = old behaviour (each member follows its own flag). Default 1.
party_combat_hold=1
; reach_test: PROBE (0.7.0-dev). 1 = while a weapon slides between the hip and the hand, the owner's RIGHT arm (bicep + forearm rotations) bends so the hand chases the
; weapon; REACH lines in the log (ch_main) show wrote= and persist= (0 = the engine resamples the arm each frame, which the write needs). Needs probe=1, bone_test=1,
; place_mode=drawgate and a non-zero draw_slide_ms / stow_slide_ms. Both hands (the left-hand weapon bends the left arm). Default 0 = no arm writes.
reach_test=0
; reach_carry: 1 = (needs reach_test=1) the weapon rides the real hand while it is drawn or holstered: the hand swings between the mount and its normal position and the blade goes with it,
; spinning with the wrist (draw: over the shoulder for a high mount, then forward and down; holster: the reverse). 0 = the weapon slides on its own line and the arm chases it (0.7.x). Default 1.
reach_carry=1
; reach_pole_<hip|over>_<lightsaber|melee|qstaff|pistol|rifle|heavy>=x,y,z: which way the elbow bends while the hand reaches (RIGHT arm, body frame: x right, y forward, z up; the left arm
; mirrors x). "hip" applies to a mount at the waist, "over" to a mount at or above the shoulder (blended by mount height). Defaults, e.g. melee: hip 0.6,-0.4,-0.4 (elbow back, out, down),
; over 0.5,0.0,0.85 (elbow up and out: the hand goes up and over the shoulder to the hilt). Uncomment to tune; log lines REACH ... u= lt= show the blend and the target in the body frame.
;reach_pole_over_melee=0.5,0.0,0.85
;reach_pole_hip_pistol=0.5,-0.7,-0.2
; delay_party: 1 = the shorter exit applies to every party member (up to 3), 0 = the controlled creature only. Default 1.
delay_party=1
; ch_toggle: TOGGLE lines (key edge, draw / stow / refused), DELAY lines (a cut: slot, before, elapsed, kind) and HOSTILE lines (duration of the first 20 enemy scans). Needs probe=1.
ch_toggle=0
