[patch]
id = "holster"
name = "Holstered Weapons"
version = "0.6.0-dev"
author = "local"
description = "0.6.0-dev: move_hold_ms (default 1500, 0 = off) skips the shorter-exit cut while a party member is walking / running and for that long after, so a flourish started standing still survives starting to move; party_combat_hold (default 1) keeps every party member's weapons drawn while ANY party member is in combat (the flag is per creature). 0.5.2-dev: log-only HW15 animation-style probe (ANIMRES also logs hol= weapon-on-hip and comb= client combat flag; extra ids 0x283C/D/E, 0x2806, 0x28BD). 0.5.1-dev: draw_slide_ms / stow_slide_ms (default 350 each, 0 = instant) ease a weapon between the hip and the hand instead of snapping; 0 and 0 is the 0.5.0 behaviour. 0.5.0-dev: flourish_draw (default 1) keeps a party member's weapon in the hand during the flourish stance window (alert stance without the combat flag). P0 probe for holstered weapons (doc 42): logs the client combat-flag setter, the in-world rhand/lhand weapon attach, the weapon-set swap executor, wield-transition animation ids and the Gob attach-transform update, so the hip/back holster design can be settled from evidence. Changes no game behaviour unless holster.ini sets bone_test=1 (flag-file experiment): with place_mode=drawgate (default) weapons keep the native hand attach and are placed on the hip (bone_name, default pelvis_g, or place_bone_*) only while their owner is out of combat, so they are drawn in combat; place_mode=repoint is the old global repoint of the rhand/lhand attach node to bone_name. 0.4.0-dev adds place_rot_body_<name> (per-body rotation delta; an older DLL ignores the key, so a downgrade changes placement). 0.3.0-dev (drawgate + bone_test only): a toggle key (default F8) draws / stows the weapons by a timed hold, and the post-combat / flourish stance ends after ~1.5 s instead of 8 s when no enemy is within 30 m (server +0x524 countdown cut). Needs holster.ini (probe=1 plus ch_* switches; log holster_log.txt; needs a [holster] section with level=info in the game-dir kplog.ini or every line is dropped)."

provides = ["k2.holster@1"]
requires = []
conflicts = []

