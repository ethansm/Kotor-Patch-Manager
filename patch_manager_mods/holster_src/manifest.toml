[patch]
id = "holster"
name = "Holstered Weapons"
version = "0.16.0-dev"
author = "local"
description = "0.16.0-dev (REINSTALL: the mod still carries hook H4b HolsterAnimStyle + export from 0.13.0-dev; no hook change since): fixes the resolver-side key. The animation resolver hands the creature's BODY object, not the creature, to the probe and to the unarmed_anim override, so ANIMRES always read hol=0 comb=0, the unarmed_anim override never matched and the move hold (move_hold_ms) never fired; all three now map the body back to the owning creature (ANIMRES gains a trailing own=, comb= is the owner's combat flag, ANIMSTYLE owner= is the creature). Known limit: the damage reaction clip is not covered by unarmed_anim. 0.15.0-dev (DLL-only, SWAP): per-category draw / stow slide time and reach grab share (pistol 300/350, lightsaber 350/350, melee and rifle 520/600, heavy and qstaff 570/700; draw_slide_ms_<type>, stow_slide_ms_<type>, reach_grab_pct_<type>; a clamped value is now logged); creature weapons (w_cr*) and unclassified weapons are no longer put on a mount (PLACEREFUSE notholsterable); reach_test=1 only: the reach is chosen by the mount height (hinge / over / hip / thigh) instead of the bone name, per-type hinge outward offsets (reach_hinge_out_<type>), the weapon keeps one hand hemisphere per slide, the wrist axis stays put past 180 deg, the grab offset unwinds in the hand frame (reach_resid_ms), reach_wrist_max_deg default 120; REACH lines gain topo= and bk=; CONFIG gains slide=. 0.14.0-dev (DLL-only, SWAP; reach_test=1 + reach_carry=1 only): reversing a running draw / stow keeps the arm path, carried weapon and arm weight continuous (no jump at the reversal, arm speed stays normal); an owner / combat read that fails for up to 3 frames mid-slide no longer snaps the weapon to the hand (SLIDE cut then only logs real cuts); a transient arm refusal (quat read, pose, solve) re-applies the last solved arm for up to 3 frames instead of dropping to the animation (REACH hold= lines). 0.13.0-dev (REINSTALL: new hook H4b HolsterAnimStyle + export): unarmed_anim (default 1): a holstered party member (weapon on the hip, not in combat) resolves its walk / run clips as unarmed, so rifle / heavy / dual-wield carriers stop running around holding an invisible weapon; the style byte is overwritten in the resolver frame only for locomotion ids; ch_anim logs ANIMSTYLE lines and hol=1 ANIMRES lines for locomotion ids. 0.11.0-dev: reach_hinge (default 1): back mounts are reached by a hinged arm instead of a bowed line: L-shaped ready pose, the whole arm pitches up with the elbow locked at 90 deg until the upper arm points forward, then the upper arm parks while the forearm closes back over the shoulder onto the weapon (the elbow lifts when the mount sits behind the shoulder); the carry is the exact reverse; REACH lines gain hg= and f=. 0.10.0-dev: wrist rotation: the hand is turned from the weapon's mount orientation at the grab to its resting orientation (reach_wrist_pct, reach_wrist_max_deg), so the weapon swings with the wrist; the reach and release follow the same arc as the carry (up and forward first, not backwards); the elbow relaxes into the animation pose earlier while the hand comes down; the path bows up / forward / outward per weapon type (heavy weapons straight up and out to clear the head; reach_bulge_<type>). 0.9.1-dev: the carried draw has phases: the hand first reaches up and back to the mount and grabs the weapon (reach_grab_pct of the slide, default 30), then brings it up, forward and down to the ready hand; holster is the reverse (carry to the mount, let go, hand back to rest); the weapon stays on the mount until grabbed instead of snapping into the hand. 0.9.0-dev: reach_carry (default 1, needs reach_test=1): the weapon rides the real hand while it is drawn or holstered, so the blade swings forward and down with the arm (and back up over the shoulder) instead of sliding on its own line; the elbow style now holds the whole swing, so a sword drawn over the shoulder is also holstered over it, and the hand path arcs over the shoulder for high mounts. 0.8.0-dev: k2.holster API gains SetPreviewDraw (the Holster editor Draw / Holster toggle under its 3D view): the preview weapons slide between the mount and the hand like in the world, with the same arm reach when reach_test=1 (struct grows, older editors ignore it). 0.7.1-dev: reach_test now bends BOTH arms (right and left hand weapons) and picks the elbow direction by weapon category and mount height (hip: elbow back and out; upper back: elbow up and over the shoulder), eased into the animation elbow as the weapon reaches the hand; reach_pole_<hip|over>_<category>=x,y,z overrides it. 0.7.0-dev: probe-only right-arm reach during the draw/stow slide (reach_test, default 0 = off; needs probe=1, bone_test=1, place_mode=drawgate): the bicep and forearm local rotations are bent so the hand chases the sliding weapon, logged as REACH lines (persist= says whether the engine resamples the bone each frame); DLL-only, SWAP, no hook changes. 0.6.0-dev: move_hold_ms (default 1500, 0 = off) skips the shorter-exit cut while a party member is walking / running and for that long after, so a flourish started standing still survives starting to move; party_combat_hold (default 1) keeps every party member's weapons drawn while ANY party member is in combat (the flag is per creature). 0.5.2-dev: log-only HW15 animation-style probe (ANIMRES also logs hol= weapon-on-hip and comb= client combat flag; extra ids 0x283C/D/E, 0x2806, 0x28BD). 0.5.1-dev: draw_slide_ms / stow_slide_ms (default 350 each, 0 = instant) ease a weapon between the hip and the hand instead of snapping; 0 and 0 is the 0.5.0 behaviour. 0.5.0-dev: flourish_draw (default 1) keeps a party member's weapon in the hand during the flourish stance window (alert stance without the combat flag). P0 probe for holstered weapons (doc 42): logs the client combat-flag setter, the in-world rhand/lhand weapon attach, the weapon-set swap executor, wield-transition animation ids and the Gob attach-transform update, so the hip/back holster design can be settled from evidence. Changes no game behaviour unless holster.ini sets bone_test=1 (flag-file experiment): with place_mode=drawgate (default) weapons keep the native hand attach and are placed on the hip (bone_name, default pelvis_g, or place_bone_*) only while their owner is out of combat, so they are drawn in combat; place_mode=repoint is the old global repoint of the rhand/lhand attach node to bone_name. 0.4.0-dev adds place_rot_body_<name> (per-body rotation delta; an older DLL ignores the key, so a downgrade changes placement). 0.3.0-dev (drawgate + bone_test only): a toggle key (default F8) draws / stows the weapons by a timed hold, and the post-combat / flourish stance ends after ~1.5 s instead of 8 s when no enemy is within 30 m (server +0x524 countdown cut). Needs holster.ini (probe=1 plus ch_* switches; log holster_log.txt; needs a [holster] section with level=info in the game-dir kplog.ini or every line is dropped)."

provides = ["k2.holster@1"]
requires = []
conflicts = []

