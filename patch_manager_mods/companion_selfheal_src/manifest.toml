[patch]
id = "companion-selfheal"
name = "Companion Self-Heal"
version = "0.2.0-probe"
author = "local"
description = "Probe for companion self-heal (doc 27 CS2): logs the HUD panel layout, portrait slot to HUD mapping, companion vitals/skills, healing-item candidates and the route A args on Ctrl+Shift+H. Default INI = log only (no engine calls, no engine writes). Opt-in [probe] call=1 adds Ctrl+Shift+J: one CanUseItem + UseItemRouteA self-heal call with POST logging; [probe] label=1 adds one test label on the HUD. Needs portrait-slots."

requires = ["portrait-slots"]
requires_interfaces = ["k2.portraitslots@1"]
conflicts = []

[patch.supported_versions]
kotor2_steam_aspyr = "6A522E71631DCEE93467BD2010F3B23D9145326E1E2E89305F13AB104DBBFFEF"
