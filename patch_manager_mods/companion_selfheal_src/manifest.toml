[patch]
id = "companion-selfheal"
name = "Companion Self-Heal"
version = "0.4.2-dev"
author = "local"
description = "Companion self-heal (doc 27 CS4+CS5): a cross-icon button beside each companion health bar (grey when disabled, a rotating gold ring when auto is on) (left click = use the best healing item now, right click = popover with Auto on/off, use-below %, keep reserve; settings persist to companion_selfheal.ini) and an optional per-companion auto mode. Owns no hook: builds its 12 HUD labels in hud-host's BUILD phase (k2.hud@1, 0x0040F5A0) (cross and ring art are embedded textures); route A is only called behind the HUD gate, commandable and CanUseItem. Ctrl+Shift+H dump and the opt-in [probe] call=1 Ctrl+Shift+J are kept. Needs portrait-slots and hud-host."

requires = ["portrait-slots", "hud-host"]
requires_interfaces = ["k2.portraitslots@1", "k2.hud@1"]
conflicts = []

[patch.supported_versions]
