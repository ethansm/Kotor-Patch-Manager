; mod_config.ini -- Mod Configuration provider. Read at the first Options screen (mod-config 0.3.4-dev). Keep each comment on its own line.
[mod-config]
; enabled: master switch. 1 = the Mod Configuration button and the shared Options pages. 0 = every hook returns at once.
enabled=1
; debug: 1 = extra debug lines in the log (hook entries, button rects, per-control flags saved when the vanilla controls are hidden). 0 = quiet.
debug=0
; button_clone: 1 = the root, list, entry and Back controls are real button clones (BTN_GAMEPLAY, BTN_EXIT). 0 = label clones. A failed clone falls back to a label either way.
button_clone=1
; reflow: 1 = insert the Mod Configuration button after GAMEPLAY and move the later rows down one pitch. 0 = put it below QUIT.
reflow=1
; desc: 1 = hovering a button writes a description into the description pane through the vanilla function. 0 = no description.
desc=1
; free_labels: 1 = free our buttons and labels when the Options panel is destroyed (r7 recipe). 0 = leak them (D3a behaviour).
free_labels=1
; arrow_icons: 0 = the option-row arrows are "<" ">" text on the button clone. 1 = reserved for chevron icons (not built: logged only, the text arrows are used either way).
arrow_icons=0
; selftest: 0 = off. 1 = register the built-in "Mod-config self test" entry (8 option rows: toggles, steppers, two sliders) for play checks. 2 = same entry with 26 rows (one more slider among the filler rows) plus six filler entries, so the entry page and the mod list both scroll. Never leave on in a shipped config.
selftest=0
