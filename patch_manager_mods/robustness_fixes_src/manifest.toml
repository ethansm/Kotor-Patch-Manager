[patch]
id = "k2-robustness-fixes"
name = "Engine Robustness Fixes"
version = "1.2.1"
author = "local"
description = "Small engine robustness fixes from the KOTOR II engine research program (doc 10 Phase 6E), each independently switchable in robustnessfixes.txt (key=0 disables one, enabled=0 all): kt (resource key-table teardown leaves a dangling key-entry pointer that is later written to freed heap), vmid (negative NWScript command ids bypass the dispatch bounds check), sndri (Options > Sound apply with Force Software leaves Miles shut down until a second apply), netovf (oversized network message overruns the 2x64 KB send ring), guiid (huge control id in a .gui file pads the control list until allocation fails), abbound (action-bar list shrink copies past the new buffer), fs (failed resource Service leaves a stale buffer that Malloc overwrites; fs=1 default counts only, fs=2 also frees), ssb (save-thumbnail capture dereferences a missing camera), ssc (save-thumbnail capture uses uninitialised dimensions in a square/portrait window), td (2DA token over 255 characters smashes the stack cookie), vmlk (ActionDoCommand leaks the script situation when OBJECT_SELF is gone), movspin (movie wait loop busy-spins; one Sleep(1) per message pump; DEFAULT OFF, movspin=1 enables). DLL-only; every site is byte-verified before writing and a mismatch skips only that fix. Log: robustnessfixes_log.txt (loaded line, COUNTERS and one-shot FIRED lines show which fixes actually triggered in play)."

requires = []
conflicts = []

[patch.supported_versions]
kotor2_steam_aspyr = "6A522E71631DCEE93467BD2010F3B23D9145326E1E2E89305F13AB104DBBFFEF"
