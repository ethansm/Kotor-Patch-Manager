# Byte patches this mod's DLL writes into the game itself (not KPM hooks), for the static checks
# (scripts/check_hook_bytes.py, scripts/check_hook_spans.py). Schema, one [[code_patches]] table per site:
#   name              group/site name used in the C++ source
#   address           absolute VA of the first patched byte
#   original_bytes    the vanilla bytes at address (length = span); check_hook_bytes compares them to the vanilla exe
#   kind              "code" (default) or "data" (a constant, not an instruction: boundary check skipped)
#   verifies_original true if the writer memcmp's the site and refuses on a mismatch (cite the line in `source`)
#   enabled_by        config gate, free text
#   source            file:line in this mod's C++ (original bytes, verify and write)
# Sites are written per group; verifySite() memcmp's every site of a group before any of it is written.

[[code_patches]]
name = "kt_a"
address = 0x00726527
original_bytes = [0x89, 0x50, 0x0C, 0xC7, 0x45, 0xFC, 0xFF, 0xFF, 0xFF, 0xFF]
kind = "code"
verifies_original = true
enabled_by = "robustnessfixes.txt kt=0 (or enabled=0) disables the group (default on)"
source = "RobustnessFixes.cpp:54,152-156"

