name = "kt_a"
address = 0x00726527
original_bytes = [0x89, 0x50, 0x0C, 0xC7, 0x45, 0xFC, 0xFF, 0xFF, 0xFF, 0xFF]
kind = "code"
verifies_original = true
enabled_by = "robustnessfixes.txt kt=0 (or enabled=0) disables the group (default on)"
source = "RobustnessFixes.cpp:76,193-198"

