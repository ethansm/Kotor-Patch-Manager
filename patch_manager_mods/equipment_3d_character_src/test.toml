# Default for every equipment-3d-character test: warnings are errors. Per-test tables replace (not merge) these keys.
cxxflags = ["-Werror"]

# Per-test table: the Common contract test needs the shared headers + host Win32 stub.
[common_contract_test]
cxxflags = ["-I../_shared_src", "-I../../research/companion_levelup/tools/parity/stub", "-DGUIKIT_HOST", "-DWINDOWHOOK_HOST", "-Werror"]
