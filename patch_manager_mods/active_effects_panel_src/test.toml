# Default for every active_effects_panel test: warnings are errors. Per-test tables replace (not merge) these keys.
cxxflags = ["-Werror"]

# Cases generated by scripts/check_effect_decode.py --emit-cases; live DECODE lines from the play log fixture.
# -Wno-format-truncation: wrapAppend's 255-byte candidate buffer truncates by design (the Python oracle models it as [:255]).
[chareff_decode_test]
cxxflags = ["-Werror", "-Wno-format-truncation"]
args = ["testdata/decode_cases.txt", "research/decode_samples_live.txt"]
