; holster_editor.ini -- holster editor 0.1.1-probe. Read at game start. Keep each comment on its own line.
; enabled: master switch. 1 = the Holstered weapons button and editor mode on the in-game Options screen. 0 = every hook returns at once.
enabled=1
; debug: 1 = extra debug lines in the log (per-control flags saved on entering editor mode, button column rects).
debug=0
; button_clone: 1 = the entry and Back are real button clones (BTN_GAMEPLAY, BTN_EXIT). 0 = the D3a label clones. A failed clone falls back to a label either way.
button_clone=1
; reflow: 1 = insert the entry after GAMEPLAY and move the later rows down one pitch. 0 = put the entry below QUIT.
reflow=1
; desc: 1 = hovering the entry writes a description into the description pane through the vanilla function. 0 = no description.
desc=1
; free_labels: 1 = free our buttons and labels when the Options panel is destroyed (r7 recipe). 0 = leak them (D3a behaviour).
free_labels=1
; free_view: 1 = also free the 3D view block after the preview creature is destroyed (probe, unproven). 0 = leak it.
free_view=0
