; holster_editor.ini -- holster editor 0.3.1-dev. Read at every Options open. Keep each comment on its own line.
; The menu button, list page, hover text and control freeing belong to mod-config (mod_config.ini).
; enabled: master switch. 1 = the Holstered Weapons entry in Options -> Mod Configuration. 0 = no page is built.
enabled=1
; free_view: 1 = also free the 3D view block after the preview creature is destroyed (probe, unproven; only when mod-config has unlinked it). 0 = leak it.
free_view=0
; view_yaw: starting camera yaw in degrees. Default 180. Which side of the character this shows is not verified yet; tune it in play.
view_yaw=180
; view_zoom: starting camera zoom factor (clamped between 0.8 and 4.0).
view_zoom=2.2
; view_panz: starting camera vertical pan in metres (clamped between -1.0 and 1.0).
view_panz=0
; probe_names: ITEMNAME on each member build. 0 = off (the weapon buttons show the model resref). 1 = call the engine's item GetName with identified=0 (side-effect free): logged, and the item name is shown on the weapon buttons. 2 = also identified=1 (logged only; can reach an unchecked lookup branch).
probe_names=1
; probe_calib: U0b calibration click probe (log only). 1 = while the page is live in nav mode the status line asks you to click one body part at a time (head centre, belt, right hand, left hand, right foot, left foot; the character's own sides) and each click inside the view is logged as a CALIB line. 0 = off, normal status text.
probe_calib=1
; status_fit: multiplier on the status pane width when the status text is cut with "..." (the label font is not measured). 1 = the pane width. Raise it (up to 8) if the weapon-mode help line or the calibration prompt is cut too short.
status_fit=1
