; holster_editor.ini -- holster editor 0.5.0-dev. Read at every Options open. Keep each comment on its own line.
; The menu button, list page, hover text and control freeing belong to mod-config (mod_config.ini).
; enabled: master switch. 1 = the Holstered Weapons entry in Options -> Mod Configuration. 0 = no page is built.
enabled=1
; free_view: 1 = also free the 3D view block after the preview creature is destroyed (probe, unproven; only when mod-config has unlinked it). 0 = leak it.
free_view=0
; view_yaw: starting camera yaw in degrees. Default 180. Which side of the character this shows is not verified yet; tune it in play.
view_yaw=180
; view_zoom: starting camera zoom factor, also what Reset view returns to (clamped between 0.4 and 4.0). 0.95 fits the standing character in the view (0.6, the 0.4.4 default, left a lot of empty space); lower shows more, higher is closer.
view_zoom=0.95
; margin_px: how far the left column grows into the empty screen margin on the left and the inspector into the right margin (0 to 400). 0 = stay inside the Options panes. If controls near the screen sides do not draw, set 0.
margin_px=120
; desc_cover_px: the right description box (our framed label drawn over mod-config's description list box) is grown this far on all four sides so it fully covers that list box's own brighter, thicker frame (0 to 24). Clamped under the preview pane, to the right of the view and inside the screen. 0 = no growth (the 0.4.9 look). Raise it if a bright edge still shows around the box, lower it if the box touches the view.
desc_cover_px=6
; view_panz: starting camera vertical pan in metres (clamped between -1.0 and 1.0).
view_panz=0
; probe_names: ITEMNAME on each member build. 0 = off (the weapon buttons show the model resref). 1 = call the engine's item GetName with identified=0 (side-effect free): logged, and the item name is shown on the weapon buttons. 2 = also identified=1 (logged only; can reach an unchecked lookup branch).
probe_names=1
; log_verbose: 0 = quiet (default): per-edit lines, WARN/ERR, REG, ENTER, LEAVE, BUILD, DISCARD and the CAM2 camera probe are always logged, nothing else repeats. 1 = also log every CHORD state transition and reset, the INSP refresh counts and the repeated CAMHOOK / PROJ re-projections. Turn it on only to chase a mouse or projection problem.
log_verbose=0
; (probe_calib is gone: the page has no nav mode any more, so the click-calibration probe cannot run. The key is ignored.)
; probe_cam: engine camera probe (log only). 1 = on the first live view, after a view change and when a weapon edit opens, read the preview camera object and the engine's own world-to-screen answer for both hands and the weapon mount, and log CAMPTR / CAMENG / CAMATT / CAMPROJ / CAMCHK lines (at most 10 captures per Options open), plus the CAM2 draw viewport / scene rect / clip stack lines (at most 3 sets). Read-only; nothing is changed. 0 = off.
probe_cam=1
; probe_caption: button caption probe (log only). 1 = when a button moves (and on the first layout) log CAPTION lines with the button rect, the caption text rect and the text renderer state, before and after the fix (at most 40 per Options open). 0 = quiet.
probe_caption=1
; caption_fix: the engine insets each button's caption text rect by the border size, which drops or misplaces the caption at 34 px rows. 1 = set the caption rect to the engine's x/w and the button's own y/h after every layout. 0 = leave the engine's rect.
caption_fix=1
; text_k: vertical scale used when measuring label text (buttons, captions, hints, status) to cut it with "...". The engine draws these labels about 2.64x wider than a scale of 1 predicts (measured at 3840x1600). Default 2.65, range 0.5 to 6. Lower it if text is cut shorter than the box, raise it if text still runs over the edge.
text_k=2.65
; status_fit: multiplier on the width the status label text (left column, under Save / Revert) is cut to with "..." (the label font is not measured). 1 = the label width. Raise it (up to 8) if the status text is cut too short.
status_fit=1
