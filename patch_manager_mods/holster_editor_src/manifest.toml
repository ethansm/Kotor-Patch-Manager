[patch]
id = "holster-editor"
name = "Holster Editor"
version = "0.1.0-dev"
author = "local"
description = "Scaffold for the in-game holster placement editor (D3a). Hooks the GUI panel constructor (OptBindView), the panel Draw (OptTick, the hot path shared by every panel) and the panel destructor (OptDestroy). Scaffold only: the handlers pass every call through, so no game behaviour changes yet. Needs holster (k2.holster@1) and preview-3d (k2.preview3d@1)."
kind = "patch"

requires = ["holster", "preview-3d"]
requires_interfaces = ["k2.holster@1", "k2.preview3d@1"]
conflicts = []

