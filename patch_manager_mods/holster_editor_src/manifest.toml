[patch]
id = "holster-editor"
name = "Holster Editor"
version = "0.3.0-dev"
author = "local"
description = "Holster placement editor, 0.3.0-dev (doc 42 HW-EDIT, HW-UX2 U2). A hookless consumer of mod-config (k2.modconfig@1, k2.menuui@1): registers one Holstered Weapons entry under Options -> Mod Configuration and provides 3D preview, stance/emote controls, weapon selection chips (item names), bone cycling, scopes, a Move/Depth/Tilt/Roll-Turn mode bar, and live holster nudging (LMB turns the character, RMB + LMB drag moves the weapon, RMB + wheel is depth). Needs mod-config, holster (k2.holster@1) and preview-3d (k2.preview3d@1); log holster-editor_log.txt."
kind = "patch"

requires = ["holster", "preview-3d", "mod-config"]
requires_interfaces = ["k2.holster@1", "k2.preview3d@1", "k2.modconfig@1", "k2.menuui@1"]
conflicts = []

