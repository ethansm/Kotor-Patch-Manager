[patch]
id = "holster-editor"
name = "Holster Editor"
version = "0.4.0-dev"
author = "local"
description = "Holster placement editor, 0.4.0-dev (doc 42 HW-EDIT, HW-UX3 page rebuild). A hookless consumer of mod-config (k2.modconfig@1, k2.menuui@1; needs mod-config 0.1.3 or later for the description split and the 80-item page): registers one Holstered Weapons entry under Options -> Mod Configuration with a 3D preview that shows the whole character, always-on weapon editing, direct buttons for hand, bone, scope, stance and party member, a Move/Depth/Tilt/Roll-Turn mode bar, live holster nudging (LMB turns the character, RMB + LMB drag moves the weapon, RMB + wheel is depth) and an inspector of six sliders (Slide, Depth, Height, Tilt, Roll, Turn) with a thumb, the value beside the track and reset arrows. Needs mod-config, holster (k2.holster@1) and preview-3d (k2.preview3d@1); a log-only engine camera probe (CAMENG / CAM2, ini probe_cam); log holster-editor_log.txt."
kind = "patch"

requires = ["holster", "preview-3d", "mod-config"]
requires_interfaces = ["k2.holster@1", "k2.preview3d@1", "k2.modconfig@1", "k2.menuui@1"]
conflicts = []

