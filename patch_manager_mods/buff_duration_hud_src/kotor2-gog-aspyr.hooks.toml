# GOG Aspyr build. Hook addresses from patch_manager_mods/21b_gog_address_map.md section 1 (static-verified only: the hook
# windows are byte-identical to the Steam original_bytes below; untested live, GOG contributor testing required). Steam address -> GOG address
# is noted per hook. Function names, parameters and original_bytes are the same as kotor2-steam-aspyr.hooks.toml.
[metadata]
target_versions = ["777BEE235A9E8BDD9863F6741BC3AC54BB6A113B62B1D2E4D12BBE6DB963A914"]

# PortraitIconRowDraw, just before the icon widget Draw(): swap FILL image + shrink
[[hooks]]
address = 0x00517084   # Steam 0x00745A84
type = "detour"
function = "RetargetBuffIcon"
original_bytes = [0x8B, 0x4D, 0xE0, 0x8B, 0x11, 0x8B, 0x4D, 0xE0, 0x8B, 0x42, 0x38, 0xFF, 0xD0]
exclude_from_restore = []

[[hooks.parameters]]
source = "[ebp-0x4c]"
type = "int"

[[hooks.parameters]]
source = "[ebp-0x18]"
type = "int"

[[hooks.parameters]]
source = "[ebp-0x20]"
type = "int"

[[hooks.parameters]]
source = "[ebp+0x10]"
type = "int"

# PortraitIconRowDraw, after Draw() on the buff row: restore image and size
[[hooks]]
address = 0x00517097   # Steam 0x00745A97
type = "detour"
function = "RestoreBuffIcon"
original_bytes = [0x0F, 0xB6, 0x4D, 0xEF, 0x03, 0x4D, 0xC4]
exclude_from_restore = []


# PortraitIconRowDraw, row exit (after the native arrow loop, before the card viewport pops):
# draw the icon column. cardW/cardH are the viewport locals [ebp-0x8]/[ebp-0x4].
[[hooks]]
address = 0x005170EC   # Steam 0x00745AEC
type = "detour"
function = "DrawBuffColumn"
original_bytes = [0x8D, 0x55, 0xD0, 0x52, 0x8B, 0x45, 0xE0]
exclude_from_restore = []

[[hooks.parameters]]
source = "[ebp-0x4c]"
type = "int"

[[hooks.parameters]]
source = "[ebp-0x20]"
type = "int"

[[hooks.parameters]]
source = "[ebp+0xc]"
type = "int"

[[hooks.parameters]]
source = "[ebp+0x10]"
type = "int"

[[hooks.parameters]]
source = "[ebp-0x8]"
type = "int"

[[hooks.parameters]]
source = "[ebp-0x4]"
type = "int"
