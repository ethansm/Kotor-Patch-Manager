[patch]
id = "npc-world-probe"
name = "NPC World Probe (V2a client of npc-world)"
version = "0.1.0-probe"
author = "local"
description = "Diagnostics client of the npc-world library (k2.npcworld@1), no hooks of its own. Stages from npc_world_probe.ini [probe] stages=: t26 (the old k1-spawn-probe roster, c_drdmouse01 + k1p_native_npc in 204tel, the NB0 live check), pool (ini rows), capacity (N copies of one template on a grid, N = 1/6/18), persist (hook-spawn survival evidence across save/load: +0x11AC/+0x11FC, engine-restored copies, previous-visit verdict) and frame (tick interval windows before and after the spawns). Spawns only what the stage list asks for, through the library's Spawn(). Opt-out: stages=none."

requires = ["npc-world"]
requires_interfaces = ["k2.npcworld@1"]
conflicts = ["k1-spawn-probe", "area-hook-probe"]

# Steam/LAA only. DLL-only patch: it owns no detour, so the three world hooks must come from npc-world (which loads first via requires).
# Design: patch_manager_mods/40_npc_behaviour_variety.md sections 12 and 13.
[patch.supported_versions]
kotor2_steam_aspyr = "6A522E71631DCEE93467BD2010F3B23D9145326E1E2E89305F13AB104DBBFFEF"
