# H1: CExoResMan::GetKeyEntry (0x00712360) miss fallback at 0x0071244E.
# 9 bytes (2 instructions): MOV ECX,[EBP+0x10] / MOV DWORD PTR [ECX],0.
# Non-zero return jumps to 0x00712462 (MOV ESP,EBP / POP EBP / RET 0x10) with EAX=1.
# skip_original_bytes = true: the KPM wrapper runs the stolen bytes AFTER the handler, so on a served hit
# they would re-zero *ppTable (GetKeyEntry then returns 1 with a NULL table -> crash). VFS_OnGetKeyEntryMiss
# therefore writes `*(uint32_t*)[ebp+0x10] = 0` itself on every path that returns 0; the native tail at
# 0x00712457 (reached on 0) still zeroes *ppEntry and EAX.
[[hooks]]
address = 0x0071244E
type = "detour"
function = "VFS_OnGetKeyEntryMiss"
original_bytes = [0x8B, 0x4D, 0x10, 0xC7, 0x01, 0x00, 0x00, 0x00, 0x00]
consumed_exit_address = 0x00712462
skip_original_bytes = true
exclude_from_restore = ["eax"]

[[hooks.parameters]]
source = "ebp"
type = "int"

