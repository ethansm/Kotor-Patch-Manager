; Companion AI 0.2.1-probe -- copy next to swkotor2.exe. Re-read at most once a second (when the file changes); no restart.
; Every behaviour has a flag here; all flags 0 = vanilla. One log: companion-ai_log.txt in the game folder (shared KpLog core; enable it with a [companion-ai] section in kplog.ini; ai_trace.txt on an old core).
; Designs: patch_manager_mods/mods678_research/ai_review_2026-10-01/designs/ (trace + engine fixes).
[CompanionAI]

; ======================= trace layer =======================
; master switch for the trace (T1-T3 script capture, E1-E3 engine points); fixes below have their own flags
trace=1
; T1 ShipBuild() returns FALSE for the traced scripts (their debug prints run) + T2/T3 PrintString/AurPostString capture
scripts=1
; E1 attack-entry spin detector, E2 slot-6 fallback, E3 perception-1 rate
engine_points=1
; scripts whose ShipBuild is flipped and whose prints are logged (case-insensitive, * wildcard)
trace_scripts=k_ai_master,k_hen_*dlg,a_atkonend,a_force_combat,k_combat_rnd
; ai = only trace_scripts; all = every script (scan: every guarded block is print-only); off = never flip
shipbuild_scope=ai
; 1 = also log PrintString/AurPostString of non-traced scripts (no ShipBuild flip for them)
prints_all_scripts=0
; object filter: party members pass
party_only=1
; extra creature tags that pass (comma list, * wildcard), e.g. boss tags
tags=
; 1 = every creature/object passes (enemies run k_ai_master too: noisy)
log_all=0
; 0 = traced PrintStrings skip the engine's own PRINTSTRING: formatting
engine_print=1
; AurPostString lines
log_aur=1
; identical consecutive trace line (same object + text) within this window -> one "R ... repeated Nx" line
dedupe_ms=1000
; per-second cap on trace lines (fix events and summaries are exempt); dropped lines are counted, then one marker
max_lines_per_sec=200
; file cap: one marker line, then writes stop (counters continue); raising it here resumes
max_file_mb=64
; buffered log flushed at most this often (fix events and markers flush at once)
flush_ms=250   ; unused since 0.2.1-probe (KpLog flushes; set flush_ms in kplog.ini [global])
; E1: attack entries within one AIUpdate burst / per second that count as a spin
a1_burst_threshold=4
a1_rate_threshold=400
; 1 = per-second E1 rate line for every traced attacker and E3 every second (else every summary_sec)
engine_verbose=0
; S counter summary period (seconds)
summary_sec=10
; per-session budget of E3 per-creature detail lines
p1_detail_lines=20

; ======================= engine fixes =======================
; A1: a Ranged (11) / Stationary (12) companion whose target is out of reach re-queued its attack forever.
; 1 = end the stuck action (the 3 s end-of-round fallback then re-runs the AI). Never approaches.
a1=1
; RAW stances (stats+0x146) A1 applies to; 16 = Ranged (Kiting) of ranged-ai (mapped to 11 by its E-H3)
a1_stances=11,12,16
; 1 = party members only
a1_party_only=1
; 1 = before ending, switch to the nearest visible enemy within weapon range (as the PC does; the range is the one
; the attack's approach test used, not the PC tail's own 0x571570(self,0,1) value)
a1_retarget=1
a1_retarget_stances=11,12,16
; < 3000 shortens the fallback timer after an A1 end; 3000 = engine value
a1_rethink_ms=3000

; P1: non-party creatures re-perceive the party on every AI tick (throttle stamp never stored). Behaviour change for
; enemies (stealth gets frame-rate independent): shipped OFF until a stealth/aggro test.
p1=0
p1_interval_ms=250

; FM1: the leader bumping a following companion cleared its whole queue. 1 = keep a follow-only queue (the
; push-aside move goes in front); every other queue is cleared as vanilla.
fm1=1
; > 0 = in combat, cap the fallback timer to this after a bump clear (0 = engine value)
fm1_rethink_ms=0

; FM4: saving resets party FollowInfo. 1 = snapshot/restore the live state (save file bytes unchanged); 0 = vanilla
fm4=1

; A4: crash guard for a NULL spell row in AIActionCombat (modded item spells); any creature. With a4=0 such a row
; faults as in vanilla, but inside CompanionAI.dll (crash logs then name the DLL; same address +0x154)
a4=1

; C1: ClearHostileActionsVersus skipped the action that slid into slot 0 after a delete
c1=1
; 1 = party members only (enemy behaviour stays vanilla)
c1_party_only=1

; A3 (optional): clear the orientation lock left on a dead/undetected target (party, not the controlled character)
a3=0

; fix event lines (A1/FM1/FM4/A4/A3) and the S summaries
log=1

; ===== probes (log only) =====
; Phase-4 probe build (engine_ai_atlas/PROBE_DESIGN.md): every probe only logs ("PR"/"PRS" lines in ai_trace.txt), behaviour stays vanilla.
; An INI 0 stops the logging but the hook stays installed (the wrapper still runs). Party members pass the filter; tags=/log_all=1 widen it
; (SHX and FM3 log every subject).
; FM2C: PlotPathInArea result 2 (partial) vs 3 (failed) per (creature, target): is the ledge fight a creeping-partial loop?
probe_fm2c=1
; FM2F: MoveToPoint FAIL leg: how often the 2-4 s wait really runs per pair
probe_fm2f=1
; FM2R: action 0x11 re-approach loop rate (range, distance, progress per pair)
probe_fm2r=1
; FM3: scheduler wrap sentinel (UpdateState level end + RemoveObject): LOST levels per minute
probe_fm3=1
; RS: RunScript return-address histogram: slot-6 sites, OnBlocked runs per second, shout deliveries (E9)
probe_rs=1
; P2: real perception cadence per party creature; is a player-controlled companion also on 4 s?
probe_p2=1
; PF: who writes the party flag (+0x11AC) and when (save/transfer bounce pairs)
probe_pf=1
; RAR: RunActions histogram per creature (action type x result), queued move under a SetState, stuck pending actions
probe_rar=1
; SHX: shout delivery exits (end / break / abort) and attempt counts
probe_shx=1
; SS1: SetState commits on companions (old -> new)
probe_ss1=1
; GCA: GetCurrentAction results vs the last RunActions type (E4 key)
probe_gca=1
; PARTY: party flag table and the controlled creature on area / leader / flag-write changes
probe_party=1
; A1X: strict range test of the A1 retarget candidate, combat-lapse follow-up and orphan after an A1 end
probe_a1x=1
; per-probe session budget of PR lines (then summaries only)
probe_lines=400
