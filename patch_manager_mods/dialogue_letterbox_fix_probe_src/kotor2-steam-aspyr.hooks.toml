# ---- 1.0.1-probe: log-only windows W1-W5 (engine_research_findings/V8b.md (c)); every handler returns at once unless
# dialogue_letterbox_fix.ini has probe=1. No register is excluded from restore (the wrapper also FXSAVE/FXRSTORs the x87 state).

# CSWGuiDialogLetterbox::Draw (0x8BB260), top bar, after the SetExtent call: MOV EAX,[EBP-0x34] ; MOV ECX,[EAX+0x10] (6 bytes, two
# whole instructions, no branch inside, no branch target inside; EAX/ECX are dead-written and reloaded right after).
# Why: logs the rect just passed to SetExtent ([ebp-0x18..-0xC]) and the control rect after it, mode, done flag, alpha.
[[hooks]]
address = 0x008BB461
type = "detour"
function = "dlbProbeW1"
original_bytes = [0x8B, 0x45, 0xCC, 0x8B, 0x48, 0x10]
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "pointer"

