# CSWGuiDialogLetterbox::Draw, just before CALL 0x40EC90 (base panel Draw): FLD float [EBP+8] ; FSTP float [ESP] ; MOV ECX,[EBP-0x34]
# (9 bytes, x87 pair stolen; the handler never touches the x87 stack and the wrapper saves/restores it anyway).
# Why: logs the base-Draw predicate (WOULD-DRAW or the first failing term) and DAT_00a309b4/b8/bc.
[[hooks]]
address = 0x008BB538
type = "detour"
function = "dlbProbeW3"
original_bytes = [0xD9, 0x45, 0x08, 0xD9, 0x1C, 0x24, 0x8B, 0x4D, 0xCC]
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "pointer"

# CSWGuiPanel::Draw (0x40EC90, base, HOT: every panel every frame), after CALL 0x479460 (GUI fill rect): ADD ESP,0x1C ; TEST EAX,EAX
# (5 bytes; the JZ that follows reads the flags of the stolen TEST, executed after the handler). eax is NOT excluded from restore.
# Why: logs the fill result for the letterbox bars only (handler filters on *(void**)this == 0x009A7CBC first).
[[hooks]]
address = 0x0040ED9F
type = "detour"
function = "dlbProbeW4"
original_bytes = [0x83, 0xC4, 0x1C, 0x85, 0xC0]
exclude_from_restore = []

[[hooks.parameters]]
source = "ebp"
type = "pointer"

[[hooks.parameters]]
source = "eax"
type = "int"

