[patch]
id = "juhani-char"
name = "Juhani (K1 port) VFS bundle"
version = "0.1.0-dev"
author = "local"
description = "DLL-only client of asset-vfs (doc 44 VFS-B1): at KPatchInit registers the Juhani bundle (models, DXT1 TPC textures, UTC, DLG, lips, SSF, VO and bark streams, appearance/heads/soundset rows 818/249/70) with k2.assetvfs@1 and the character with k2.characterlib@1. No hooks, no game-dir files. The bundle is private (CR textures + K1 audio) and is linked from ~/Games/KOTOR2_Mod_Workspace/k1_port_stage/vfs_bundle/ when present; without it the DLL logs 'no bundle' and registers nothing. The k1-spawn-probe roster does the spawn."

requires = ["asset-vfs"]
requires_interfaces = ["k2.assetvfs@1", "k2.characterlib@1"]
conflicts = []

# Steam/LAA only. DLL-only patch: it owns no detour.
[patch.supported_versions]
kotor2_steam_aspyr = "6A522E71631DCEE93467BD2010F3B23D9145326E1E2E89305F13AB104DBBFFEF"
