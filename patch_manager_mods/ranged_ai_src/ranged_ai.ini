; Ranged AI 0.3.0 -- copy next to swkotor2.exe. Re-read at most once a second; no restart needed.
[RangedAI]
; a held creature ends its attack action instead of walking to the target when the shot is blocked
hold=1
; retarget like the player does on the second blocked check at the same position
retarget=1
; AI stances (stats+0x146) the behaviours apply to; 16 = "Ranged (Kiting)" (opt-in, from the stance menu).
; 11 = vanilla "Ranged": leave it out to keep the vanilla stances vanilla.
hold_stances=16
retarget_stances=16
; stance 16 also gets vanilla Ranged's engine rule: a companion does not walk towards its target (E-H3)
ranged_rules=1
; 0.3.0: ...but only with a ranged weapon AND the target in weapon range. Out of range (or holding a melee weapon)
; stance 16 approaches like Aggressive (a ranged weapon walks until in range, then shoots). 0 = the 0.2.0 rule.
kite_approach=1
; floaty message strref shown on selecting "Ranged (Kiting)" (written by scripts/append_ranged_kite_tlk.py at install;
; 123710 = vanilla "Ranged Behavior" message as fallback)
kite_strref_msg=123710
; stance menu / HUD icon ResRef (Override/<name>.tga)
kite_icon=ib_ranged
; diagnostics (ranged_ai_log.txt in the game folder, one session per file). Party members of every stance are logged.
log=1
; 1 = also log non-party creatures (noisy)
log_all=0
