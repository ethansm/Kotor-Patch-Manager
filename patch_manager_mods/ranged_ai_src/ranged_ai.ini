; Ranged AI -- copy next to swkotor2.exe. Re-read at most once a second; no restart needed.
; Stage 0 = hold=0 retarget=0 (logging only).
[RangedAI]
; Stage 2: a held creature ends its attack action instead of walking to the target when the shot is blocked
hold=0
; retarget like the player does on the second blocked check at the same position
retarget=0
; AI stances (stats+0x146) the behaviours apply to; 11 = vanilla "Ranged", 16 = "Ranged (Kiting)" (Stage 3)
hold_stances=11
retarget_stances=11
; diagnostics (ranged_ai_log.txt in the game folder)
log=1
; 1 = also log non-party creatures (noisy)
log_all=0
