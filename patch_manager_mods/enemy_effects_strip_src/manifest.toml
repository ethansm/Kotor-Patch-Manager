[patch]
id = "enemy-effects-strip"
name = "Enemy Effects Strip"
version = "0.3.0-dev"
author = "local"
description = "Draws the status-effect icons of the current target as a bare row above the target menu name label, gated by the party leader's Awareness (obvious states, then party debuffs, then everything with a drain overlay). Configured by enemy_strip.ini [Strip]: Enabled, Verbose, MaxIcons, IconSize, Gap, Spacing, TierObvious/TierOwn/TierFull, DrainAlpha, Backing, BackingAlpha, BackingPad, ForceTier (needs hud-host)."

requires = ["hud-host"]
requires_interfaces = ["k2.hud@1"]
conflicts = []

