; enemy_strip.ini -- Enemy Effects Strip 0.3.0-dev. Optional: copy next to swkotor2.exe. Every key is optional; the values below are the defaults.
[Strip]
; Master switch (1 = draw the icon row above the target menu name label).
Enabled=1
; 1 = also log the 0.2.0 probe blocks (menu geometry, effect list, icon cache, Awareness); 0 = only the 'strip:' change lines.
Verbose=0
; Most icons shown at once, 1..8. This INI is read once at DLL load: every change needs a game restart.
MaxIcons=5
; Icon edge in px; 0 = the name label height.
IconSize=0
; Pixels between the icon row and the name label.
Gap=4
; Pixels between neighbouring icons.
Spacing=4
; Leader Awareness rank needed to see obvious states (stun, hold, sleep, fear, entangle, knockdown, slow).
TierObvious=5
; Awareness rank needed to also see debuffs the party applied.
TierOwn=12
; Awareness rank needed to see every tracked debuff and buff, with the remaining-time drain overlay.
TierFull=20
; Effective alpha 0..1 of the drain overlay on the icons (tier full only).
DrainAlpha=0.65
; 1 = draw a pill behind the row.
Backing=0
; Alpha 0..1 of that pill.
BackingAlpha=0.55
; Pixels the pill extends beyond the row on every side.
BackingPad=4
; -1 = tier from the leader's Awareness; 0..3 forces a tier (0 none, 1 obvious, 2 + own debuffs, 3 everything).
ForceTier=-1
