[patch]
id = "k2-dialogue-letterbox-fix"
name = "K2 Dialogue Letterbox Fix"
version = "0.1.0"
author = "ethansm"
description = "Restores the dialogue letterbox bars on ultrawide resolutions (at 3840x1600 the vanilla bar height is negative and the bars vanish). Rewrites the 2.3333 aspect constant at 0x009A7D30 whenever the screen size changes so the bars are H/6 tall. Config: dialogue_letterbox_fix.ini (enabled, mode=h6|clamp|vanilla, log=0|1; log=0 default writes only the load line, first apply, first SetTop/SetBottom and problems) in the game folder; log: kplog.ini [k2-dialogue-letterbox-fix] (channels main, set) -> k2-dialogue-letterbox-fix_log.txt on a core with the kpatch.log service; on an old core dialogue_letterbox_fix_log.txt."

requires = []
conflicts = []

