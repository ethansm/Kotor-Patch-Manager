  "patch_manager_mods/42_holstered_weapons.md",
  "patch_manager_mods/42_holstered_weapons_master_plan.md",
  "patch_manager_mods/43_asset_import_and_npc_programme.md",
]
deps = true
focus = "Two unrelated patches in one upload. (1) holster_src: probe-stage DLL that detours weapon attach, combat-flag and weapon-swap code and can repoint the rhand/lhand attach-node literal (bone_test). Check hook prologue and span safety, reentrancy, case-insensitive bone lookup, state across combat, save/load and area change. (2) npc_world_src (shared hooks for area load, creature add and main loop, plus the native creature spawn sequence) and k1_spawn_probe_src (client that spawns a pet and an NPC on area load, 204tel). Check the spawn sequence (allocation, constructor, load from template, orientation, add to area, failure cleanup), object lifetime and ownership on failed loads, duplicate spawns after save and reload (the existence guard uses a tag seen at AddToArea), hook reentrancy, and whether each logic test can fail. The NPC design is in patch_manager_mods/43_asset_import_and_npc_programme.md (Track B); docs 38 and 40 are not included because of the size cap. Judge whether each test can fail when the code is wrong."
