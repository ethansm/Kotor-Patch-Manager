]
exclude = ["patch_manager_mods/action_hotbar_src/hotbar_logic_test.cpp"]
omit = [
  "patch_manager_mods/action_hotbar_src/common_contract_test.cpp",
  "patch_manager_mods/_shared_src/K2Addr.h",  # in 3a_shared_headers
  "patch_manager_mods/_shared_src/GuiKit.h",
]
deps = true
focus = "Host tests for the Action Hotbar config round trip, 2DA/TLK/key-BIF readers and logging, plus the fixture generators. The code under test arrives as included headers. Judge whether each test can fail when the code is wrong and name missing edge cases (truncated or malformed files)."

