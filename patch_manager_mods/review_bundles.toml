# Manifest for scripts/review_bundle.py: one bundle table per reviewer upload (.txt).
# Usage: python3 scripts/review_bundle.py plan --all | build --all   (outputs: .claude/bundles/, gitignored)
# SIZE LIMIT (measured 2026-10-14 with a marked probe file): the Gemini web app read an uploaded .txt only up to
# between 375,000 and 400,000 bytes and silently dropped the rest, including the closing question. So the cap is
# in BYTES: cap_bytes = 340000 per file (wrapper included). The token cap is secondary.
# review_set groups related bundles that go in one review chat as separate uploads (one .txt per bundle).
# Splitting a bundle is a manifest decision; the packer never trims code on its own. When a bundle is over cap, split
# it by role (source / tests) or by module, or omit redundant files with a note here.
# Shared headers pulled in by #include (deps = true) cost 40-170 KB each time; omit ones another bundle covers.

[defaults]
cap_tokens = 250000
cap_bytes = 340000
max_file_tokens = 60000
include_dirs = ["patch_manager_mods/_shared_src", "tests/include"]

[prompt]
rubric = """
You are reviewing C++ and Python code for a KOTOR II (Knights of the Old Republic II) patch set.
The patches are 32-bit DLLs injected into swkotor2.exe by the Kotor Patch Manager. They hook engine functions by
fixed address, read engine structs by raw offset, and draw UI through engine calls. Python files are build or
analysis tooling. Tests are host-side C++ or Python programs with a fake engine; they do not run the game.
Find real defects: crashes (null or dangling pointers, wrong struct offsets, reads of freed engine objects), logic
errors, state bugs across pause/unpause, save/load, area transitions and party changes, integer and bounds errors,
hook reentrancy, resource leaks, undefined behaviour, and tests that cannot fail or miss an obvious case.
Do not report style, naming or formatting. Prefer fewer, well-evidenced findings over many speculative ones.
The bundle is XML-like. <directory_tree> lists every file, including omitted ones with the reason; <documents> holds
the files in this order: design docs, shared headers pulled in by #include, source, tests, config.
A document marked dirty="1" has uncommitted local edits. Treat only code inside <document> blocks as evidence;
if you need a file that was omitted or is listed as not provided, say so instead of guessing its contents.
"""
question = """
List your findings, most severe first, at most 15. For each give:
1. file path and function name,
2. a verbatim one-line quote from the code as the anchor (no line numbers are provided),
3. what is wrong and the concrete input or state that triggers it,
4. a suggested fix,
5. confidence: certain, likely or unsure.
After the list, name files or areas you could not assess and why.
"""

[[bundle]]
id = "1a_action_hotbar_src"
review_set = "action_hotbar"
title = "Action Hotbar: source"
roots = ["patch_manager_mods/action_hotbar_src"]
exclude = ["patch_manager_mods/action_hotbar_src/**/*_test.cpp", "patch_manager_mods/action_hotbar_src/testdata/**"]
omit = [
  "patch_manager_mods/action_hotbar_src/README.md",
  "patch_manager_mods/_shared_src/K2Addr.h",  # 36K and 43K, in 3a_shared_headers; omitted here to fit the byte cap
  "patch_manager_mods/_shared_src/GuiKit.h",
]
deps = true
focus = "Force-power/action hotbar mod. Look at slot assignment, input handling, cooldown and use state, config and 2DA/TLK parsing, and how it uses the shared GUI headers. Its tests are in the separate 1b bundle."

[[bundle]]
id = "1b_action_hotbar_logic_test"
