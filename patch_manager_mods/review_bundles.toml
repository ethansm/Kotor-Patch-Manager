  "patch_manager_mods/_shared_src/K2Addr.h",  # in 3a_shared_headers
  "patch_manager_mods/_shared_src/GuiKit.h",
]
docs = ["patch_manager_mods/07_force_power_hotbar.md"]
deps = true
focus = "Host logic test for the Action Hotbar plus its design doc. The code under test arrives as included headers; the full source is the separate 1a bundle. Judge whether the test can fail when the code is wrong, and whether the code follows the doc."

[[bundle]]
