[patch]
id = "perf-lab"
name = "Perf Lab"
version = "0.6.0"
author = "local"
description = "Diagnostics (inert unless perflab_debug.txt exists): allocation census via IAT hooks on HeapAlloc/HeapReAlloc/HeapFree; metrics=1 adds the measurement pack M1-M7 (resman by restype, async-wait time, GetImage after upload, glFinish/mipmap time, frame-time histogram, movie spin, engine globals) and vq=1 an address-space census; 0.3.0 adds engine live counters, per-name texture tables (BR), resman/KT, NWScript VM and net-ring counters and per-handler hook cost; all written to perflab_*.txt. Flag-gated experiments, off by default: tx=1 (free TPC images after GL upload), g1skip=1 (skip glFinish per texture upload) and, new in 0.4.0, hwmip=1 (hardware mipmaps: replace CPU gluBuild2DMipmaps with glTexImage2D + glGenerateMipmap / GL_GENERATE_MIPMAP for POT 2D and cube-face uploads, GLU fallback otherwise; hwmip_* counters). 0.5.0 adds measurement-only lines: client module name in the #METRICS header, EVT (save/load/options events), TPCTOP/RESTOP (largest live resources at load end), VA (address-space summary), re-demand/TXI/requeue byte ledgers, GlobalMemoryStatus cost and hwmip validation (HWV). 0.6.0 adds RenderBackend pass timing (RB), AIQ scan loop and heavy update telemetry (AI), Texture-id scan and FocusGob strcmp counters (TEXSCAN/FOCUS_STRCMP), helper-thread GUI modal RTTI sampler (state=), CExoString ToLower counter (TOLOWER), and abreserve capacity reuse experiment. Research program: patch_manager_mods/10_engine_optimization_research.md."

requires = []
conflicts = []

[patch.supported_versions]
kotor2_steam_aspyr = "6A522E71631DCEE93467BD2010F3B23D9145326E1E2E89305F13AB104DBBFFEF"
