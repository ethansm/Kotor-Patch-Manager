# Per-frame function called from CClientExoAppInternal::MainLoop (0x78262C) and a few init paths
# (doc 10): frame heartbeat; its first call applies the flag-gated experiments tx/g1skip (0.2.0). Prologue 55 8B EC 83 EC 28 = PUSH EBP / MOV EBP,ESP / SUB ESP,0x28.
# Deliberately NOT 0x00781BE0, which load-hang-probe owns.
[[hooks]]
address = 0x00478A20
type = "detour"
function = "PerfLabTick"
original_bytes = [0x55, 0x8B, 0xEC, 0x83, 0xEC, 0x28]
skip_original_bytes = false
exclude_from_restore = []

