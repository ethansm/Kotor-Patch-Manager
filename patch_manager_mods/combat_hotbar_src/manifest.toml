[patch]
id = "combat-hotbar"
name = "Combat Action Hotbar"
version = "0.4.0-dev"
author = "local"
description = "Combat Action Hotbar (Mod 31, 0.4.0-dev: CH2 invoke keys, Ctrl+Shift+F9..F11 by default, CH3b optional hiding of the carousel arrows, and the CH4b clickable icon button grid under the three target-menu group boxes, 2 columns per group, [Buttons] INI Enabled/Cols/MaxRows/Gap; the buttons are created in the K2HUD_BUILD phase, which needs hud-host 0.3.0+; configured by combat_hotbar.ini) on top of the diagnostic probe. Consumer of hud-host (k2.hud@1, TARGET_MENU_PRE at CSWGuiTargetActionMenu::PopulateMenus 0x00743540; owns no hook itself) to safely probe and log the target menu groups (groups 0-2, meanings unverified), selected keys, target type, leader, and per-entry usability flags and owner fields when an enemy is targeted."

requires = ["hud-host"]
requires_interfaces = ["k2.hud@1"]
conflicts = []

[patch.supported_versions]
kotor2_steam_aspyr = "6A522E71631DCEE93467BD2010F3B23D9145326E1E2E89305F13AB104DBBFFEF"
