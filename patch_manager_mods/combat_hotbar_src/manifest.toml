[patch]
id = "combat-hotbar"
name = "Combat Action Hotbar"
version = "0.6.0-dev"
author = "local"
description = "Combat Action Hotbar (Mod 31, 0.6.0-dev: CH4d draws one vanilla pill container per target-menu group behind the buttons (lbl_miscroll_f art, tint and alpha copied live from the hidden vanilla BTN_TARGETn, [Buttons] CapPad/SidePad, gap clicks swallowed, hover-freeze area = container union); CH4c replaces the three vanilla target-menu group boxes with our own vanilla-styled clickable icon buttons (frame + hover highlight + icon), laid out in three columns under the banner and frozen in place while the cursor is over them; [Buttons] INI Enabled/Replace/Cols/MaxRows/BtnPx/Pad/GroupGap/Inset/ClickSound; needs hud-host 0.4.0+ (POST at the PopulateMenus tail) and its K2HUD_BUILD phase. Also CH2 invoke keys, Ctrl+Shift+F9..F11 by default, and CH3b optional hiding of the carousel arrows; configured by combat_hotbar.ini) on top of the diagnostic probe. Consumer of hud-host (k2.hud@1, TARGET_MENU_PRE at CSWGuiTargetActionMenu::PopulateMenus 0x00743540; owns no hook itself) to safely probe and log the target menu groups (groups 0-2, meanings unverified), selected keys, target type, leader, and per-entry usability flags and owner fields when an enemy is targeted."

requires = ["hud-host"]
requires_interfaces = ["k2.hud@1"]
conflicts = []

[patch.supported_versions]
kotor2_steam_aspyr = "6A522E71631DCEE93467BD2010F3B23D9145326E1E2E89305F13AB104DBBFFEF"
