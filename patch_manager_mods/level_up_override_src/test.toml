# Per-test table: the Common contract test needs the shared headers and the host Win32 stub (mirrors shield_bar_src/test.toml).
# Per-test tables replace the top-level keys, so ../_shared_src is repeated.
[common_contract_test]
cxxflags = ["-I../_shared_src", "-I$HOME/Games/KOTOR2_Mod_Workspace/tools/kotor-patch-manager/Patches/Common", "-I../../research/companion_levelup/tools/parity/stub", "-DGUIKIT_HOST", "-Werror"]

# R10 probe state machine (pure header R10Probe.h); no shared headers needed.
[r10_probe_test]
cxxflags = ["-Werror"]

# R10 PC filter page model (pure header R10Page.h over R10Filter.h).
[r10_page_test]
cxxflags = ["-Werror"]

# R10 filter logic (pure header R10Filter.h) + the real r10_tags.ini (path relative to this directory, the run cwd).
[r10_filter_test]
cxxflags = ["-Werror"]
args = ["../../research/companion_levelup/runtime/r10_tags.ini"]
