# Byte patches this mod's DLL writes into the game itself (not KPM hooks), for the static checks
# (scripts/check_hook_bytes.py, scripts/check_hook_spans.py). Schema: see robustness_fixes_src/code_patches.toml.
# The three tex_scan_* call-site patches (0.1.0-0.1.1) were removed in 0.1.2: the cache never got a hit.

[[code_patches]]
name = "mem_status"
address = 0x00478A57
# 0x00478A20 (per-frame stats tick): `CALL dword ptr [0x00986128]` (GlobalMemoryStatus IAT) -> imm32 = &g_pfnGms (DLL)
original_bytes = [0xFF, 0x15, 0x28, 0x61, 0x98, 0x00]
kind = "code"
verifies_original = true
enabled_by = "always (KPatchInit); mem_status_cache=0 calls the real API every time; restored on FreeLibrary"
source = "K2EnginePerf.cpp installPatches / uninstallPatches (MemStatusCache.h, codepatch::writeChecked)"
