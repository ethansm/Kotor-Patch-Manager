type = "detour"
function = "QueueHudCapture"
original_bytes = [0x8B, 0x8D, 0x94, 0xFE, 0xFF, 0xFF, 0x8B, 0x91, 0x04, 0xA9, 0x00, 0x00]
exclude_from_restore = []

[[hooks.parameters]]
