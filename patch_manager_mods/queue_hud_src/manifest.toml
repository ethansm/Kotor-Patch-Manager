[patch]
id = "queue-hud"
name = "Queue HUD"
version = "0.1.0-dev"
author = "local"
description = "Shows the vanilla combat action-queue panel (up to 4 icons, green) OUT of combat, so a use-item or cast-spell command given while paused is visible while it waits for unpause (dimmed while the head action is waiting). Read-only toward the engine: one capture hook on the HUD update plus a portrait-slots HUD_DRAW callback. Optional queue_hud.ini in the game folder (enabled, bg_rgb, bg_alpha, border_rgb, border_alpha, border_px, waiting_dim, waiting_alpha, log). Needs portrait-slots."

requires = ["portrait-slots"]
requires_interfaces = ["k2.portraitslots@1"]
conflicts = []

# Steam Aspyr only (static RE: 30_queue_hud_evidence/RE.md; not yet live-tested). No GOG address map.
[patch.supported_versions]
kotor2_steam_aspyr = "6A522E71631DCEE93467BD2010F3B23D9145326E1E2E89305F13AB104DBBFFEF"
