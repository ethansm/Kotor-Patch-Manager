; queue_hud.ini -- Queue HUD 0.3.0-dev. Optional: copy next to swkotor2.exe. Every key is optional; the values below are the defaults.
; Colours are "r,g,b" floats 0..1, alphas 0..1, border_px a single digit 1..6. Bad values are ignored (the default stays).

; Master switch for the out-of-combat queue panel.
;enabled = 1

; --- 0.4.0: kit look & palette ---
; kit = 1 (default) draws each slot as the embedded qh_frame image (icon inset 15%); kit = 0 skins the queue
; in dark teal (matching custom GUI theme).
;kit = 1
; Frame alpha 0..1 (scaled by waiting_alpha for the dimmed head slot).
;frame_alpha = 0.9
; The Cancel controls (wide "CANCEL QUEUE" bar beneath leader queue, left of each companion strip; out of combat only). 0 = none.
;cancel = 1

; Slot styling: dark teal palette { 0.05, 0.25, 0.28 } bg, { 0.10, 0.58, 0.62 } border.
;bg_rgb = 0.05,0.25,0.28
;bg_alpha = 0.45
;border_rgb = 0.10,0.58,0.62
;border_alpha = 0.9
;border_px = 2

; Dim slot 0 while the head action is waiting (paused, round busy or a delayed action).
;waiting_dim = 1
;waiting_dim_rgb = 0.03,0.15,0.18
;waiting_alpha = 0.6

; Edge-triggered log lines (kplog.ini [queue-hud]: channels main, cap, icon, draw).
;log = 1

; Per-command trace lines (CMD# / WAIT / RESOLVE / DROP / EDGE / QJ) on the "trace" channel. One line per command or edge, never per frame. Needs log = 1.
trace_queue=1
; One CLICK line per left-button press (time + cursor), to line a click up with EDGE / ROUND lines. Needs trace_queue (1 = on).
trace_clicks=1

; --- eaten-action re-inject and combat handoff ---
; Re-inject a queued item/spell that the engine wiped while paused (1 = on).
pause_reinject=1
; While paused, an eaten command waits for unpause (no re-inject, no budget spent); one re-inject with a fresh budget follows the unpause (1 = on, 0 = old behaviour).
pause_eaten_wait=1
; Hold a buffered dispatch while the engine still shows its busy flags (aa8/ab8) after the previous command; releases after 2 s at most (1 = on, 0 = old behaviour).
dispatch_wait_flags=1
; Hand the buffered queue to the engine when combat starts (1 = on).
handoff_on_combat=1
; Clear the engine queue for the hand-off member before its first re-sent command (1 = on).
handoff_clear_first=1
; QL10 probe: leave the engine queue alone at the hand-off so the new click (attack/power) survives (1 = on, 0 = clear-first behaviour above).
handoff_keep_new=1
; QL10: while an engine-held command waits, take the new power/attack out of the combat round list and put it back after the hand-off, so it runs after your queued items (1 = on, 0 = off).
handoff_detach_held=1
; QL10: the keep-new / detach / reorder path also runs when combat starts unpaused (1 = on; 0 = only while paused, unpaused clears first as before).
handoff_keep_unpaused=1
; Re-send the active command the engine still held at the combat edge if it vanishes without ever running; a command that ran is never re-sent (1 = on, 0 = old behaviour).
handoff_resend_held=1
; Replay a buffered Force power with a NULL position when the engine's own call had a NULL position (1 = on, 0 = old behaviour: pointer to a zeroed copy).
spell_replay_pos=1
; Soft combat (combat flag on, but everybody only targets your own party, e.g. a medpack on an ally with no enemy around): hide the top combat banner (1 = on).
; The banner comes back by itself if a hostile shows up while still in that combat.
hide_banner_soft=1
; Same for the red Cancel Combat bar at the bottom (1 = on).
hide_redbar_soft=1
; Keep the companion queue strips drawn during combat (1 = on).
show_in_combat=1

; --- 0.2.0: companion queue strips (party members 1-2) ---
; A small green row of queue icons above/below each companion portrait card (same look as the leader panel; the first icon dims while waiting).

; Master switch for the companion strips (the leader panel is unaffected).
;companions = 1

; Icon edge in px. 0 = auto (left: the self-heal button side, 16..24 px; above / below: 60% of the health-bar height; at least 12). Otherwise 8..96.
;strip_icon_px = 0

; Where the row sits: left (default: left of the health bar, clear of the self-heal button), above (bottom edge 2px over the
; card top) or below (top edge 2px under the card bottom). Stacked companion cards are only ~19 px apart at 3840x1600, so
; above / below need a small strip_icon_px (e.g. 16).
;strip_side = left

; Maximum icons per strip, 1..4.
;strip_max = 4
