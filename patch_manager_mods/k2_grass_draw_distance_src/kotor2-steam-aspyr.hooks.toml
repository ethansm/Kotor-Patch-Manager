source = "ecx"
type = "pointer"

# Hook 5 / 6 (0.1.5): the two CALL dword ptr [0x00986304] (glDrawArrays) in FUN_004369A0, the grass-only draw helper
# (callers 0x0050E16B, 0x0050E487, 0x0050E695). The hook receives a pointer to the three pushed args (mode, first, count);
# with far_lod on and mode == GL_QUADS it lowers only `count` (first quads of the bin). The helper's own offset argument
