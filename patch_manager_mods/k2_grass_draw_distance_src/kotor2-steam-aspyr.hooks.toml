[metadata]
target_versions = ["6A522E71631DCEE93467BD2010F3B23D9145326E1E2E89305F13AB104DBBFFEF"]

# Hook 1: Scene::CollectAndTraverse (0x00499610) at 0x00499ABC (MOV dword ptr [EBP-0x10], 0; 7 bytes),
# immediately before the room octree grass sphere query loop (0x00499ADC: FLD dword ptr [0x00A0F074]).
# Polls k2_grass_draw_distance.ini (1s throttle), registers the Mod Configuration page if mod-config is loaded,
# and updates the engine globals:
#   [0x00A0F070] = fade_start_dist^2 (read at 0x0050DB43 for fade start; the wind gate at 0x0050DCC8 reads the
#                                     DLL's own float after the KPatchInit operand rewrite, see code_patches.toml)
#   [0x00A0F074] = fade_end_dist^2   (read at 0x00499ADC for octree build/collect and 0x0050DB4C for fade end)
#   [0x009F5D38] = alpha_cutoff      (read at 0x004665F6 for glAlphaFunc threshold)
[[hooks]]
address = 0x00499ABC
type = "detour"
function = "K2GrassOnSceneCollect"
original_bytes = [0xC7, 0x45, 0xF0, 0x00, 0x00, 0x00, 0x00]
exclude_from_restore = []


# Hook 2: Scene::DoBinBucket (0x004664E0) at 0x0046661B (MOV dword ptr [EBP-0x4], 0; 7 bytes), the bin loop counter init
# right after glAlphaFunc. Starts the grass-pass CPU timer and (smooth_edges, multisampled context only) glEnable(
# GL_SAMPLE_ALPHA_TO_COVERAGE). Not a branch target; the loop is entered only by falling through here.
[[hooks]]
address = 0x0046661B
type = "detour"
function = "K2GrassBinLoopBegin"
original_bytes = [0xC7, 0x45, 0xFC, 0x00, 0x00, 0x00, 0x00]
skip_original_bytes = false
exclude_from_restore = []

# Hook 3: Scene::DoBinBucket at 0x00466698 (FLD dword ptr [0x00A20040]; 6 bytes), the bin loop's only exit (JGE at
# 0x00466636; reached by nothing else). Stops the timer and undoes the alpha-to-coverage enable.
[[hooks]]
address = 0x00466698
type = "detour"
function = "K2GrassBinLoopEnd"
original_bytes = [0xD9, 0x05, 0x40, 0x00, 0xA2, 0x00]
skip_original_bytes = false
exclude_from_restore = []
