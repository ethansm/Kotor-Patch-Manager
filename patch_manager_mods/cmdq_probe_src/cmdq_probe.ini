; cmdq_probe.ini -- cmdq-probe 0.1.0 (log only). Read once at game start.
; A channel logs only when probe=1 AND its ch_ key is 1. Keep each comment on its own line.
; probe: master switch. 0 = every hook returns at once.
probe=0
; ch_pause: PAUSE lines (written only when the pause value changes).
ch_pause=0
; ch_cmd: CMD lines (spell and item cast requests).
ch_cmd=0
; ch_fire: FIRE lines (spell and item fire events).
ch_fire=0
; ch_round: ROUND lines (combat round start and end, with the owner word).
ch_round=0
; ch_clr: CLR lines (queue clears holding 0x3F/0x0F/0x2E) and REEQ lines (re-equip).
ch_clr=0
; ch_med: MED lines (medical item entry and can-use).
ch_med=0
; party_only: 1 = CLR only for creatures with +0x11AC nonzero (meaning unverified); 0 = any creature whose queue matches.
party_only=1
; max_lines: total log lines this probe writes per game run (all channels share it).
max_lines=2000
