# Carth Onasi (K1 party member). Instructions only: no assets, no 2DA row numbers (the builder assigns them).
# Values from stage char_carth/override/char_build.json + doc 38 s12/s22/s24 (10-14..10-18).
[character]
id = "carth"
display_name = "Carth"
tag = "k1p_carth"          # spawn-probe roster tag (k1_client_core_test.cpp)
utc = "k1p_carth"
dlg = ""
soundset = 14              # FALLBACK only: K2 soundset.2da row 14 = n_repoff (Republic_Officer); row 11 n_commm sounded like an Ithorian (play 10-18). With [audio] below the builder appends a new row and the UTC uses that instead
template_row = 17          # appearance.2da row copied for the new row
gender = 0

[models]
converter = "mdlops"       # pykotor numbers nodes against K1: left arm out / shards on K2 bodies (doc 38 s22, memory kotor2-mdlops-node-numbers); MDLOps two-pass path with the K2 supermodel chain
# K1 Carth = p_carthba (K1-only) + p_carthbb + head p_carthh (doc 38 s12 R2)
body_a = { k1 = "p_carthba", k2 = "k1p_carthba" }
body_b = { k1 = "p_carthbb", k2 = "k1p_carthbb" }
head   = { k1 = "p_carthh",  k2 = "k1p_carthh" }

# DXT1 TPC output must be opaque (doc 38 s24); heads also get TXI "clamp 1" (K1 head TXI).
[[textures]]
k1 = "p_carthba01"
k2 = "k1p_carthba01"
force_opaque = true

[[textures]]
k1 = "p_carthbb01"
k2 = "k1p_carthbb01"
force_opaque = true

[[textures]]
k1 = "p_carthh01"
k2 = "k1p_carthh01"
force_opaque = true
txi = "clamp 1"

# Carth's own K1 barks (doc 38 s24, same route as the Juhani hand path): the builder reads K1 SSF p_carth (strrefs
# 37192..37232 are identical in the K2 dialog.tlk), copies the K1 streamsounds/P_CARTH_*.wav as STREAM assets, appends
# a soundset.2da row (resref = k2_ssf) and points the UTC at it.
[audio]
k1_ssf = "p_carth"
k2_ssf = "k1p_carthssf"
