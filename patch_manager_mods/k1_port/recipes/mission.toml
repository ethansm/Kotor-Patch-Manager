# Mission Vao (K1 party member, K1 creature template p_mission). Instructions only: no assets, no 2DA row numbers (the builder assigns them).
# Values from k1_port_scan.py facts for p_mission (chitin:templates.bif): appearance.2da row 10, soundset.2da row 81 (p_mission),
# conversation k_hmis_dialog, gender_id 1; model facts and supermodel chain in .claude/research/pykotor_writer/h7_mission_zaalbar.md (10-18).
[character]
id = "mission"
display_name = "Mission"
tag = "k1p_mission"        # spawn-probe roster tag
utc = "k1p_mission"
dlg = ""
soundset = 57              # FALLBACK only (K2 soundset.2da row 57 = n_commonf); with [audio] below the builder appends a new row and the UTC uses that instead
template_row = 17          # appearance.2da row copied for the new row
gender = 1

[models]
converter = "pykotor"      # no dangly nodes in the four K1 models (h7 recon); the body_b -> k1p_missionbb supermodel rewrite is applied to body_a and the head by the importer (P_MissionBB has no vanilla K2 copy; the user's K2 Override has a third-party one, so the map is needed)
# K1 Mission = p_missionba + p_missionbb + head p_missionh (supermodels: ba and h use P_MissionBB, bb uses S_Female03)
body_a = { k1 = "p_missionba", k2 = "k1p_missionba" }
body_b = { k1 = "p_missionbb", k2 = "k1p_missionbb" }
head   = { k1 = "p_missionh",  k2 = "k1p_missionh" }

# DXT1 TPC output must be opaque (doc 38 s24); the head mesh's textures also get TXI "clamp 1" (k1_port_scan HEAD_TXI; the head mesh references p_missionbb01 too).
[[textures]]
k1 = "p_missionba01"
k2 = "k1p_missionba01"
force_opaque = true

[[textures]]
k1 = "p_missionh01"
k2 = "k1p_missionh01"
force_opaque = true
txi = "clamp 1"

[[textures]]
k1 = "p_missionbb01"
k2 = "k1p_missionbb01"
force_opaque = true
txi = "clamp 1"

# Mission's own K1 barks (SSF p_mission) and party conversation (k_hmis_dialog), same route as recipes/carth.toml and recipes/juhani.toml.
[audio]
k1_ssf = "p_mission"
k2_ssf = "k1p_missionssf"

[dialog]
k1_dlg = "k_hmis_dialog"
k2_dlg = "k1p_missiondlg"
max_voiced = 30
