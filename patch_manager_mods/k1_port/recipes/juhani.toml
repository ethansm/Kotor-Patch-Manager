# Juhani (K1 party member). Instructions only: no assets, no 2DA row numbers (the builder assigns them).
# Values from stage char_juhani/override/char_build.json + doc 38 s12/s16/s19/s22/s24 (10-14..10-18).
[character]
id = "juhani"
display_name = "Juhani"
tag = "k1p_juhani"         # spawn-probe roster tag (k1_client_core_test.cpp)
utc = "k1p_juhani"
dlg = ""                   # hand path: kvjdlg01 / Conversation edit stays outside this recipe (audio pass)
soundset = 57              # K2 soundset.2da row 57 = n_commonf (generic female); hand path uses custom row 70 (audio pass)
template_row = 8          # vanilla K2 party row: Juhani (female PFB*M armour bodies)
gender = 1

[models]
converter = "mdlops"       # pykotor writer shreds p_juhaniba (doc 38 s22); MDLOps two-pass path is the working one
# K1 Juhani = p_juhaniba + p_juhanibb + head p_juhanih (doc 38 s12 R2)
body_a = { k1 = "p_juhaniba", k2 = "k1p_juhaniba" }
body_b = { k1 = "p_juhanibb", k2 = "k1p_juhanibb" }
head   = { k1 = "p_juhanih",  k2 = "k1p_juhanih" }

# DXT1 TPC output must be opaque (doc 38 s24); heads also get TXI "clamp 1" (K1 p_juhanih01 TXI).
[[textures]]
k1 = "p_juhaniba01"
k2 = "k1p_juhaniba01"
force_opaque = true

[[textures]]
k1 = "p_juhanibb01"
k2 = "k1p_juhanibb01"
force_opaque = true

[[textures]]
k1 = "p_juhanih01"
k2 = "k1p_juhanih01"
force_opaque = true
txi = "clamp 1"

# Juhani's own K1 barks (SSF p_juhani) and party conversation (k_hjuh_dialog), same route as recipes/carth.toml.
# Hand path (juhani-char) keeps its custom soundset row 70 and 3-line test dialog; this pack route replaces them.
[audio]
k1_ssf = "p_juhani"
k2_ssf = "k1p_juhanissf"

[dialog]
k1_dlg = "k_hjuh_dialog"
k2_dlg = "k1p_juhanidlg"
max_voiced = 30
