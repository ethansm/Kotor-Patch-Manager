; Inventory Sort & Filter -- copy next to swkotor2.exe. Re-read at most once a second; no restart needed.
; Stage 0 = everything 0 (logging only). Advance one flag at a time.
[Inventory]
; S1: backpack order = new first, usable, base item, vanilla order
sort=0
; S2: unusable rows get the red-orange "cannot use" colours
tint=0
; S3/S4: re-click the active All tab to cycle All -> New -> Usable -> Upgradeable -> All
cycle=0
cycle_states=new,usable,upgrade
; diagnostics (inventory_sort_filter_log.txt in the game folder)
log=1
log_items=1
