# Default for every hotbar test: warnings are errors. Per-test tables replace (not merge) these keys.
cxxflags = ["-Werror"]

# Per-test table: only the Common contract test needs the shared headers + host Win32 stub (mirrors _shared_src/test.toml).
# The four older hotbar tests keep their defaults.
[common_contract_test]
cxxflags = ["-I../_shared_src", "-I../../research/companion_levelup/tools/parity/stub", "-DGUIKIT_HOST", "-Werror"]

# HotbarConfig.h includes the shared FileWatch.h (POSIX branch on the host; no Win32 stub needed).
[config_roundtrip_test]
cxxflags = ["-I../_shared_src", "-Werror"]

[hotbar_bugs_test]
cxxflags = ["-I../_shared_src", "-Werror"]

[hotbar_logic_test]
cxxflags = ["-I../_shared_src", "-Werror"]
