; quick_loot.ini -- Quick Loot configuration. Optional: copy next to swkotor2.exe.
[QuickLoot]
Enabled=1
ProximityEnabled=1
OpenM=3.0
CloseM=5.0
TakeKey=70
ScanMs=250
ListRows=8
Anchor=0
; 1 = also log QL0 probe lines (ITEM / EVTRAW / EVT / SCAN); 0 keeps the log short
Verbose=0

; QL3: Hover peek on container hover (app+0x4B0) & empty container cursor indicator (doc 12)
HoverPeek=1
EmptyCursor=1
HoverDwellMs=150

; Give / quest hand-in containers: comma- or semicolon-separated placeable tags that should always route to the vanilla menu
GiveTags=
