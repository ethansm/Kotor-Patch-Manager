# Default for every quick_loot test: warnings are errors. Per-test tables replace (not merge) these keys.
cxxflags = ["-Werror"]

# Per-test table: the Common contract test needs the shared headers (SafeRead.h), the KPM checkout's Patches/Common (KpLog.h) and the host Win32 stub.
[common_contract_test]
cxxflags = ["-I../_shared_src", "-I$HOME/Games/KOTOR2_Mod_Workspace/tools/kotor-patch-manager/Patches/Common", "-I../../research/companion_levelup/tools/parity/stub", "-DGUIKIT_HOST", "-Werror"]

# 0.4.0-dev: the logic header includes TextFit.h (row / block widths), so the logic and sim tests need the shared headers on the include path.
[quick_loot_logic_test]
cxxflags = ["-I../_shared_src", "-Werror"]

[quick_loot_sim_test]
cxxflags = ["-I../_shared_src", "-Werror"]

# 0.6.0-dev (QL7): the Mod Configuration page schema + row handler (needs the shared ModConfigDecl / TomlMini and the KPM Common headers).
[quick_loot_page_test]
cxxflags = ["-I../_shared_src", "-I$HOME/Games/KOTOR2_Mod_Workspace/tools/kotor-patch-manager/Patches/Common", "-Werror"]
