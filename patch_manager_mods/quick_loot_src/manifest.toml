[patch]
id = "quick-loot"
name = "Quick Loot"
version = "0.3.1-dev"
author = "local"
description = "Clicking a loot container takes everything at once with no container menu (doc 52 QL1a): ShowContainerGui is consumed (any show flag) and the vanilla take-all Close is sent a couple of HUD frames after the container script has run, with the Close flag chosen from the items actually present. QL1b: a one-line label lists what was taken (\"Took (5): Medpac x2, Blaster Pistol, +3 more\") for 3 seconds (3.5 s for a long list). QL2p: walking up to a loot container (within OpenM, 400 ms dwell) opens it as a peek and lists its contents on one line (\"[F] Take all (5): Medpac x2, Blaster Pistol, +3 more\") on a dark backing panel; press the take key (default F) to take everything, or walk away (past CloseM) and the items stay. Hold Shift to open the vanilla menu. Configured by quick_loot.ini [QuickLoot] Enabled, ProximityEnabled, OpenM, CloseM, TakeKey, ScanMs. Keeps the QL0 probe log lines and adds PEEK-/SCAN/SUPPRESS lines. Needs hud-host for the per-frame tick."

requires = ["hud-host"]
requires_interfaces = ["k2.hud@1"]
conflicts = []

