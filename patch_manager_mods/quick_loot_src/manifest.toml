[patch]
id = "quick-loot"
name = "Quick Loot"
version = "0.4.0-dev"
author = "local"
description = "Clicking a loot container takes everything at once with no container menu (doc 52 QL1a): ShowContainerGui is consumed (any show flag) and the vanilla take-all Close is sent a couple of HUD frames after the container script has run, with the Close flag chosen from the items actually present. QL1b: a one-line label lists what was taken (\"Took (5): Medpac x2, Blaster Pistol, +3 more\") for 3 seconds (3.5 s for a long list). QL2p: walking up to a loot container (within OpenM, 400 ms dwell) opens it as a peek and lists its contents on one line (\"[F] Take all (5): Medpac x2, Blaster Pistol, +3 more\") on a dark backing panel; press the take key (default F) to take everything, or walk away (past CloseM) and the items stay. Hold Shift to open the vanilla menu. QL2L (0.4.0-dev): the one-line list became a block on the vanilla teal frame (header + one row per item, names up to 40 chars, \" xN\" stacks, ListRows rows visible); the mouse wheel over the block scrolls it (gui-input) and a Took list stays up 3 s + 0.5 s per row past 3 (cap 6 s) and is held while the cursor is over it. Configured by quick_loot.ini [QuickLoot] Enabled, ProximityEnabled, OpenM, CloseM, TakeKey, ScanMs, ListRows (default 8, 1..12). Keeps the QL0 probe log lines and adds PEEK-/SCAN/SUPPRESS/LIST/SCROLL/WHEEL-SUB lines. Needs hud-host for the per-frame tick and gui-input for the wheel (without it the first rows are shown, no scrolling)."

requires = ["hud-host", "gui-input"]
requires_interfaces = ["k2.hud@1", "k2.guiinput@1"]
conflicts = []

