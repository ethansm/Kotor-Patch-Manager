# Mira preset "early_sentinel": Convert as early as possible (first Sentinel level 7): dual-wield lightsaber (TWF line, Dual Strike, Weapon Focus: Lightsaber), Valor/Speed/Heal/Force Shield kit
# Skill points are a PROPOSAL (weighted greedy, max rank = char_level+3, cross-class cost 2). Attribute bumps follow elkripper (DEX at 8/12/16/20, CON +1 at 24/28 from live CON13).
[meta]
tag = "mira"
name = "Mira"
utc = "p_mira.utc"
variant = "early_sentinel"
summary = "Convert as early as possible (first Sentinel level 7): dual-wield lightsaber (TWF line, Dual Strike, Weapon Focus: Lightsaber), Valor/Speed/Heal/Force Shield kit"
convert_at = 7   # first Jedi (Sentinel) char level; 0 = never converts
hold_until_class = 5   # JediSentinel: mod holds level-ups until the story script adds the Jedi class

[meta.wizard]
role = "melee"
style = "dual"
alignment = "light"
convert = "early"
skills = "combat"

