variant = "melee_dual_light_early"
summary = "Convert early (first Sentinel level 8): dual lightsabers (TWF line, Dual Strike line, Weapon Focus: Lightsaber, Advanced/Master Jedi Defense), Speed/Valor/Heal light-side kit"
