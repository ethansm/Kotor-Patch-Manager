# Atton preset "melee_dual_light_early": Convert early (first Sentinel level 8): dual lightsabers (TWF line, Dual Strike line, Weapon Focus: Lightsaber, Advanced/Master Jedi Defense), Speed/Valor/Heal light-side kit
# Skill points are a PROPOSAL (weighted greedy, max rank = char_level+3, cross-class cost 2). DEX bumps follow elkripper (live DEX16).
[meta]
