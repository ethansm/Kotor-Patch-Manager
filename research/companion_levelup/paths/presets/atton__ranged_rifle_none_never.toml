# Atton preset "rifle_none_never": Never converts: Scoundrel 4-30, sniper-rifle scoundrel (Sniper Shot line, Weapon Focus: Rifle, Rapid Shot line, Critical Strike line, Precise Shot), no Force powers
# Skill points are a PROPOSAL (weighted greedy, max rank = char_level+3, cross-class cost 2). DEX bumps follow elkripper (live DEX16).
