# Disciple (Mical) PRESET caster/dark/early: convert at char 7 (Consular 1-24), offensive dark-side caster (Shock/Wound/Affliction/Lightning/Drain/Scream/Choke/Plague/Kill/Death Field/Storm). Requires the dark-side Training dialogue (PC alignment < 40, see disciple.md); mod #142 penalises dark powers if the Disciple is light.
# Skill points are a PROPOSAL (round-robin over the focus skills). Attribute rows are descriptive/unverified (companion attrs are auto-set).
[meta]
tag = "disciple"
name = "Disciple (Mical)"
utc = "p_disciple.utc"
variant = "caster_none_dark_early"
summary = "Convert at char 7 (Consular 1-24): dark-side offence (Shock, Wound, Affliction, Lightning, Drain Force, Force Scream, Choke, Plague, Kill, Death Field, Storm) plus Speed and Energy Resistance."
convert_at = 7   # first char level taken as Jedi Consular; real conversion happens when the story script allows (see disciple.md)
hold_until_class = 4   # bank levels until the Jedi Consular class exists (Disciple 'Training' dialogue)

[meta.wizard]
role = "caster"
style = "none"
alignment = "dark"
convert = "early"
skills = "combat"

