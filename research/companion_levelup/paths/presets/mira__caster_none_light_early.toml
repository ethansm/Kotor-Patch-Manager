# Mira preset 'caster_none_light_early': Light-side offensive-Force Sentinel: convert at once, Push/Whirlwind/Wave/Breach/Suppression/Throw Lightsaber control kit plus Stasis/Stun and late heal, defensive feats (Conditioning, Toughness, Mobility), no weapon-style feats
# Skill points are a PROPOSAL (weighted greedy, max rank = char_level+3, cross-class cost 2). Attribute bumps follow elkripper (DEX at 8/12/16/20, CON +1 at 24/28 from live CON13).
[meta]
tag = "mira"
name = "Mira"
utc = "p_mira.utc"
variant = "caster_none_light_early"
summary = "Light-side offensive-Force Sentinel: convert at once, Push/Whirlwind/Wave/Breach/Suppression/Throw Lightsaber control kit plus Stasis/Stun and late heal, defensive feats (Conditioning, Toughness, Mobility), no weapon-style feats"
short = "Light offense Force Sentinel, Jedi at 7"
convert_at = 7   # first Jedi (Sentinel) char level; 0 = never converts
hold_until_class = 5   # JediSentinel: mod holds level-ups until the story script adds the Jedi class

[meta.wizard]
role = "caster"
style = "none"
alignment = "light"
convert = "early"
skills = "combat"

