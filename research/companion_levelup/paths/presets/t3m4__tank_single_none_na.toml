# T3-M4 preset 'tank_single_none_na': Single-pistol damage sponge that keeps the party's tech skills: Toughness line, Gear Head line (skill bonus for the upgrade gates), Caution line, Weapon Focus late
# Skill points are a PROPOSAL (greedy by priority list, 4 pts/level at INT 16, max rank = char_level+3, cross-class cost 2). DEX +1 every 4th level per elkripper (T3 attribute gains from the player-triggered upgrade dialogs are NOT modelled).
