# Mira preset 'melee_dual_dark_early': Dark-side Sentinel (needs Exile Alignment < 40 at conversion): convert at once, dual lightsaber (TWF line, Dual Strike, Critical Strike), Speed/Deflection plus Wound/Shock/Choke/Lightning/Drain Life/Kill/Storm/Death Field
# Skill points are a PROPOSAL (weighted greedy, max rank = char_level+3, cross-class cost 2). Attribute bumps follow elkripper (DEX at 8/12/16/20, CON +1 at 24/28 from live CON13).
[meta]
tag = "mira"
name = "Mira"
utc = "p_mira.utc"
variant = "melee_dual_dark_early"
summary = "Dark-side Sentinel (needs Exile Alignment < 40 at conversion): convert at once, dual lightsaber (TWF line, Dual Strike, Critical Strike), Speed/Deflection plus Wound/Shock/Choke/Lightning/Drain Life/Kill/Storm/Death Field"
convert_at = 7   # first Jedi (Sentinel) char level; 0 = never converts
hold_until_class = 5   # JediSentinel: mod holds level-ups until the story script adds the Jedi class

[meta.wizard]
