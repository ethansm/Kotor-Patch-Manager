# Disciple (Mical) PRESET caster: convert immediately (char 7), Jedi Consular 1-24, healer/buffer, light side only. Loosely follows elkripper caster feats; powers re-prioritised to healing/buffs (elkripper's list is offence-heavy).
# Skill points are a PROPOSAL (greedy: Treat Injury + Awareness alternate, then Repair, then cross-class). Attribute rows are descriptive/unverified.
[meta]
tag = "disciple"
name = "Disciple (Mical)"
utc = "p_disciple.utc"
variant = "caster"
summary = "Convert at char 7 (Consular 1-24): Heal line, Valor line, Force Barrier, Battle Meditation, Revitalize; light-side; Master TWF/Toughness/Conditioning/Jedi Defense feats."
convert_at = 7   # first char level taken as Jedi Consular; real conversion happens when the story script allows (see disciple.md)
hold_until_class = 4   # bank levels until the Jedi Consular class exists (Disciple "Training" dialogue)

[meta.wizard]
role = "support"
style = "none"
alignment = "light"
convert = "early"
skills = "combat"

