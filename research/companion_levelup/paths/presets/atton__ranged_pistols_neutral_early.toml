# Atton preset "pistols_neutral_early": Convert early but universal powers only (no light/dark pushes): Speed line, Deflection/Redirection, Energy/Force Resistance, Force Body, Battle Meditation, Push/Whirlwind/Wave/Breach; Rapid Shot gunner, tech skills
# Skill points are a PROPOSAL (weighted greedy, max rank = char_level+3, cross-class cost 2). DEX bumps follow elkripper (live DEX16).
[meta]
tag = "atton"
name = "Atton Rand"
utc = "p_atton.utc"
variant = "pistols_neutral_early"
summary = "Convert early but universal powers only (no light/dark pushes): Speed line, Deflection/Redirection, Energy/Force Resistance, Force Body, Battle Meditation, Push/Whirlwind/Wave/Breach; Rapid Shot gunner, tech skills"
convert_at = 8   # first Jedi (Sentinel) char level; 0 = never converts
hold_until_class = 5   # bank levels 8+ until the Jedi Sentinel class exists; Sentinel picks are identical whatever char level conversion happens at

