# Disciple (Mical) PRESET caster/neutral/early/stealth: convert at char 7 (Consular 1-24), control caster using only universal (alignment-neutral) powers: Affect Mind/Dominate Mind, Mind Trick, Push/Whirlwind/Wave, Force Suppression/Breach, Speed, Energy Resistance, Deflection; no Heal/Valor (light) and no Shock/Lightning (dark). Stealth + Awareness skills. Safe under mod #142.
# Skill points are a PROPOSAL (round-robin over the focus skills). Attribute rows are descriptive/unverified (companion attrs are auto-set).
