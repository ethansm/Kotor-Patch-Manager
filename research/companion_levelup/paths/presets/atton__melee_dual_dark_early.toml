# Atton preset "melee_dual_dark_early": DARK Jedi Sentinel from first Sentinel level 8: dual lightsabers, Speed line plus Shock/Lightning, Wound/Choke/Kill, Drain Life, Storm, Death Field (needs a dark Exile conversion dialogue; mod #142 caveat)
# Skill points are a PROPOSAL (weighted greedy, max rank = char_level+3, cross-class cost 2). DEX bumps follow elkripper (live DEX16).
[meta]
tag = "atton"
name = "Atton Rand"
utc = "p_atton.utc"
variant = "melee_dual_dark_early"
summary = "DARK Jedi Sentinel from first Sentinel level 8: dual lightsabers, Speed line plus Shock/Lightning, Wound/Choke/Kill, Drain Life, Storm, Death Field (needs a dark Exile conversion dialogue; mod #142 caveat)"
short = "Dual sabers, dark side, Jedi at 8 (stealth skills)"
convert_at = 8   # first Jedi (Sentinel) char level; 0 = never converts
hold_until_class = 5   # bank levels 8+ until the Jedi Sentinel class exists; Sentinel picks are identical whatever char level conversion happens at

[meta.wizard]
