# Preset-side label defect (not a tagging error): kreia__support_none_dark.toml is labelled alignment=dark but takes light-side powers
# (Heal, Cure, Valor, Force Armor/Shield/Barrier, Aura). Kreia is a gray character; spells.2da goodevil=G is the truth, so the row tags
# stay `light` and the conflict is waived here instead of loosening the fits rule. Fix = relabel that preset alignment=neutral or drop the picks.
[[preset_waiver]]
preset = "kreia__support_none_dark.toml"
kind = "power"
reason = "dark-labelled Kreia support preset takes light-side powers (preset label defect)"

# Same defect: handmaiden__melee_single_dark_early.toml (alignment=dark) takes power 135 Force Barrier (goodevil=G, light).
[[preset_waiver]]
preset = "handmaiden__melee_single_dark_early.toml"
kind = "power"
reason = "dark-labelled Handmaiden preset takes light-side Force Barrier (preset label defect)"
