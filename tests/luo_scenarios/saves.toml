# Level-up override forced-state scenarios (Phase 6b Track M; doc 21).
#
# One scenario id = a save state + a config + expectations. The same id is used by:
#   - scripts/kotor_save_forge.py      (M1)  forges a NEW save slot "LUO TEST <id>" from [scenario.<id>.save]
#   - scripts/luo_scenario.py          (M2)  writes the game-dir ini files from [scenario.<id>.config]
#   - tools/parity/scenario_test.cpp   (M3)  runs the REAL LevelUpOverride.cpp against fake engine memory built from
#                                            [scenario.<id>.save] + [scenario.<id>.config], then checks [scenario.<id>.expect]
#   - scripts/luo_log_check.py         (M4)  checks a live log against [scenario.<id>.expect]
#
# Format (all tables optional unless noted):
#   [scenario.<id>]
#   title        = one line (required)
#   source       = default source save slot for the forge ("Game2" = slot whose savenfo name / folder suffix matches)
#   status       = "ready" | "unproven" (engine validity of the edited save not yet shown by one load) | "offline-only"
#   v_items      = V-checklist items this scenario exercises (doc 08 Phase 6 RESUME HERE)
#
#   [scenario.<id>.save]                 edits applied on top of the source save
#   guid         = "keep" (default) | "none" (remove all LUO_G*) | "partial:<n>" (keep the first n bits of the source GUID,
#                  remove the rest) | "g<8 hex>" (write this GUID)
#   [[scenario.<id>.save.creature]]      one per edited party member
#   tag          = companion tag as in the presets ("atton", "kreia", ...; "pc" = the player)
#   classes      = [["Scoundrel", 7]] list of [class name from classes.2da label, class level] in class-list order;
#                  missing = keep. Adding a class adds the class entry only; feats/powers per M0 notes.
#   xp           = total experience; missing = keep
#   in_party     = true | false (active party member); missing = keep
#   leader       = true -> this creature is the party leader
#
#   [scenario.<id>.config]               game-dir ini state (M2) / fake ini (M3)
#   mode, apply, verbose                 levelup_override.ini keys (missing = keep / M3 default rewrite,1,1)
#   companions   = { atton = "<preset>|instant=0|hold=1|pause=3" }  section for the scenario GUID in levelup_playthroughs.ini
#   playthrough_guid = "g<8 hex>" | "save" (= the GUID the forged save carries) | "none" (no section)
#   dev          = { "preset.atton" = "...", "pause.atton" = "3" }   dev keys in levelup_override.ini
#
#   [scenario.<id>.expect]
#   events       = log-event patterns that must appear (regex, matched against the raw log line after the timestamp)
#   absent       = patterns that must NOT appear
#   decisions    = M3-only: expected decision strings per action, e.g. { "atton.canLevelUp" = "HOLD" }
#
# Class names follow classes.2da labels: Soldier Scout Scoundrel JediGuardian JediConsular JediSentinel CombatDroid
# ExpertDroid Minion TechSpecialist BountyHunter JediWeaponMaster JediMaster JediWatchman SithMarauder SithLord SithAssassin.
# XP thresholds: level L needs L*(L-1)/2 * 1000 (level 8 = 28000, level 15 = 105000, level 30 = 435000).

[scenario.S1_atton_hold_default]
title = "Atton Scoundrel 7 with XP for level 8: default pause -> HOLD 1 level"
source = "Game2"
status = "ready"
v_items = [3]
[scenario.S1_atton_hold_default.save]
[[scenario.S1_atton_hold_default.save.creature]]
tag = "atton"
classes = [["Scoundrel", 7]]
xp = 28000
in_party = true
[scenario.S1_atton_hold_default.config]
playthrough_guid = "save"
companions = { atton = "atton__melee_dual_light_early|instant=0|hold=1" }
[scenario.S1_atton_hold_default.expect]
events = ['HOLD .*atton', 'BANKED']
absent = ['APPLIED .*atton', 'APPLY ABORTED']

