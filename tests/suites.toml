# Explicit test entries for scripts/run_tests.py (doc 20 Phase 0).
#
# Discovery handles `patch_manager_mods/**/*_test.cpp` and `**/test_*.py` by itself.
# This file lists everything that is not found by naming convention, plus discovery excludes.
#
# [[suite]] keys
#   name       item id is `suite:<name>`
#   cmd        argv list. A leading "python" is replaced by the interpreter (this one,
#              or .venv/bin/python when python = "venv").
#   cwd        optional, relative to the repo root (default: repo root); a value starting
#              with $ or ~ is expanded like requires (e.g. "${KPM_DIR}")
#   python     optional, "venv" = repo .venv interpreter
#   requires   optional list; each entry is a path (~, $VAR and ${VAR:-default} are expanded)
#              or `which:<tool>`. Anything missing makes the item SKIP (missing X), not FAIL.
#   timeout_s  optional (default 300)
# Variables available in requires: $REPO, $KPM_DIR (default ~/Games/KOTOR2_Mod_Workspace/tools/kotor-patch-manager),
# $KOTOR2_ROOT (game dir, default Steam install), plus the normal environment.
#
# Note: the four research/companion_levelup parity scripts write *_bin files next to their sources
# (git-ignored by research/companion_levelup/tools/parity/.gitignore).

[discovery]
# Test-looking files that must not run, each with a reason, e.g.
#   { path = "patch_manager_mods/foo/test_bar.py", reason = "needs the live game" }
exclude = []

# ---- level-up parity (host g++ + stub windows.h; cwd-independent, exit 1 on failure) ----

[[suite]]
name = "levelup-parity"
cmd = ["python", "research/companion_levelup/tools/parity/parity.py"]
requires = ["which:g++"]
timeout_s = 900

[[suite]]
name = "levelup-wizard-parity"
cmd = ["python", "research/companion_levelup/tools/parity/wizard_parity.py"]
requires = ["which:g++"]
timeout_s = 600

[[suite]]
name = "levelup-options-parity"
cmd = ["python", "research/companion_levelup/tools/parity/options_parity.py"]
requires = ["which:g++"]
timeout_s = 600

[[suite]]
name = "guikit"
cmd = ["python", "research/companion_levelup/tools/parity/guikit_test.py"]
requires = ["which:g++"]
timeout_s = 300

# ---- static checkers (read the live exe / framework .kpatch files; read-only) ----

[[suite]]
name = "check-hook-bytes"
# Every mod hook + code_patches.toml site vs the pristine vanilla exe (bytes, section, instruction boundary,
# relative branches in stolen bytes) and .kpatch packaging (doc 20 Phase 1; replaces scripts/retired/check_*_kpatch.py).
cmd = ["python", "scripts/check_hook_bytes.py", "--quiet"]
requires = [
  "${KOTOR2_VANILLA_EXE:-~/Games/KOTOR2_Mod_Workspace/backups/vanilla_clean/swkotor2.exe}",
  "${KPM_DIR}/Patches",
  "${KOTOR2_ROOT}/patch_config.toml",
  "which:i686-w64-mingw32-objdump",
]
timeout_s = 120

[[suite]]
name = "check-gui-ids"
# tests/static/gui_ids.toml vs vanilla .gui originals, the live override/ .gui files and the cited C++ constants.
cmd = ["python", "scripts/check_gui_ids.py", "--quiet"]
python = "venv"
requires = ["~/Games/KOTOR2_Mod_Workspace/ultrawide_gui/originals"]
timeout_s = 120

[[suite]]
name = "check-effect-decode"
cmd = ["python", "scripts/check_effect_decode.py"]
requires = ["${KPM_DIR}/Patches/CharEffectsPanel/EffectNameTable.inc"]
timeout_s = 60

[[suite]]
name = "check-shared-headers"
# Report-only (no --sync): drift between _shared_src and the framework Patches/Common copies.
cmd = ["python", "scripts/check_shared_headers.py"]
requires = ["${KPM_DIR}/Patches/Common"]
timeout_s = 60
