# subclassers.toml - the DLL sources allowed to subclass the game window (SetWindowLongPtr GWLP_WNDPROC).
# Consumed by scripts/check_subclassers.py (doc 20 T0 extra, Phase 3). Several DLLs chain WndProcs over one HWND, so each must
# install exactly one proc, keep the old proc, and on unload restore it ONLY IF its own proc is still on top (otherwise
# restoring would unhook a DLL that subclassed later and leave a dangling proc).
#
# [[subclasser]]
#   file          repo-relative path of the source file (forward slashes)
#   install       regex (DOTALL) matching the install: the saved old proc taken from SetWindowLong(GWLP_WNDPROC, our proc)
#   restore       regex (DOTALL) matching restore-if-still-ours: GetWindowLong(GWLP_WNDPROC) == our proc, followed by
#                 SetWindowLong(GWLP_WNDPROC, saved old proc)
#   install_hint, restore_hint   informational line numbers only; lines drift, never checked (drift is an INFO line)
#   uses          optional; "WindowHook" marks a file that subclasses through Common WindowHook.h (kp::WindowHook<Tag>, safe unhook:
#                 restore-if-on-top else pass-through). The file must name `WindowHook<` (a `using X = kp::WindowHook<Tag>` alias is
#                 fine), install/restore regexes match its X::install( / X::uninstall( calls, and it needs no direct GWLP_WNDPROC call.
#
# check_subclassers.py: FAIL for a file with a GWLP_WNDPROC SetWindowLong that is not listed here ("new WndProc subclasser:
# use Common WindowHook.h (kp::WindowHook); or register it here"), FAIL when a listed file lacks its install or restore
# pattern, WARN for a listed file with no GWLP_WNDPROC call (stale). Use single-quoted TOML literal strings for the regexes.

[[subclasser]]
file = "patch_manager_mods/inventory_3d_viewport_src/Inventory3DViewport.cpp"
install = 'g_oldProc\s*=[^;]*SetWindowLongPtr[AW]?\s*\(\s*g_hwnd\s*,\s*GWLP_WNDPROC\s*,[^;]*wheelProc'
restore = 'GetWindowLongPtr[AW]?\s*\(\s*g_hwnd\s*,\s*GWLP_WNDPROC\s*\)[^;]*==\s*wheelProc[^;]*\)\s*\{\s*SetWindowLongPtr[AW]?\s*\(\s*g_hwnd\s*,\s*GWLP_WNDPROC\s*,[^;]*g_oldProc'
install_hint = 457
restore_hint = 712

