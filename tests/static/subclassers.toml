file = "patch_manager_mods/_shared_src/WindowHook.h"
install = 'SetWindowLongPtr[AW]?\s*\(\s*h\s*,\s*GWLP_WNDPROC'
restore = 'getProc\(hwnd\)\s*==\s*proc\)\s*\{\s*whapi::setProc\(hwnd,\s*old\).*?else\s*\{\s*whapi::xchg\(&passthrough,\s*1\)'
install_hint = 12
restore_hint = 45
